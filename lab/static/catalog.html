/* ==========================================================================
   Glass Networks theme, v2 (Nov 20, 2026, A50). The single source of truth for how the lab looks.
   References: Linear (density, zinc neutrals, hairlines), Raycast (lit edges, floating glass),
   Vercel Geist (type, materials), and Shreyas's SalesOps dashboard reference (app shell, KPI cards, accents).
   Rules: docs/design/THEME.md.  Research: docs/design/UI_RESEARCH.md.

   Inlined into each page by:   python3 lab/static/sync_theme.py   (never edit the copies)
   Fonts each page loads:       Geist (300..700), Geist Mono (400..600) from Google Fonts
   ========================================================================== */

/* ---------- 1. Tokens (dark is the design; light is supported) ---------- */
:root{
  color-scheme:dark;
  --font-sans:"Geist","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* surfaces: zinc near-black; far is darker, near is lighter */
  --bg:#09090B;            /* page, sidebar, header */
  --card:#0F0F11;          /* cards and panes */
  --card-2:#141416;        /* inputs, icon boxes, hover */
  --card-3:#1A1A1D;        /* selected, tracks */
  --card-4:#222226;        /* raised thumb, hover on selected */
  --sunk:#0B0B0D;          /* code, logs, wells */
  --glass:rgb(17 17 19 / .72);
  --glass-strong:rgb(15 15 17 / .9);
  --scrim:rgb(0 0 0 / .6);

  /* hairlines */
  --border:rgb(255 255 255 / .075);
  --border-2:rgb(255 255 255 / .11);
  --border-3:rgb(255 255 255 / .18);
  --edge:rgb(255 255 255 / .04);       /* inner top light on cards */

  /* text */
  --text-1:#F4F4F5; --text-2:#A1A1AA; --text-3:#71717A; --text-4:#52525B;

  /* accents: green leads (actions, selection, good), cyan second (data, info) */
  --accent:#22C55E; --accent-hi:#4ADE80; --on-accent:#04140A;
  --accent-soft:rgb(34 197 94 / .1); --accent-ring:rgb(34 197 94 / .6);
  --cyan:#06B6D4; --cyan-hi:#22D3EE; --cyan-soft:rgb(6 182 212 / .12);
  --orange:#F97316; --orange-soft:rgb(249 115 22 / .12);
  --amber:#F59E0B; --amber-soft:rgb(245 158 11 / .12);
  --red:#EF4444; --red-hi:#F87171; --red-soft:rgb(239 68 68 / .12);
  --violet:#8B5CF6; --violet-soft:rgb(139 92 246 / .12);
  --brand-grad:linear-gradient(135deg,#22C55E 0%,#06B6D4 100%);
  /* status (meaning) */
  --ok:var(--accent); --ok-hi:var(--accent-hi); --ok-soft:var(--accent-soft);
  --warn:var(--amber); --warn-soft:var(--amber-soft);
  --bad:var(--red); --bad-hi:var(--red-hi); --bad-soft:var(--red-soft);
  --info:var(--cyan); --info-soft:var(--cyan-soft);

  /* data: diverging orange <-> cyan, neutral midpoint (validated: CVD dE 21, both in the dark band). Hex: canvas reads these. */
  --div-neg:#E8601C; --div-pos:#0E9FBF; --div-mid:#18181B;

  /* type scale */
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px; --fs-18:18px; --fs-20:20px; --fs-24:24px; --fs-32:32px;

  /* shape */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:999px;
  --h-sm:30px; --h-md:36px;
  --sb-w:248px; --hdr-h:64px;

  /* depth */
  --shadow-card:inset 0 1px 0 var(--edge), 0 1px 2px rgb(0 0 0 / .4);
  --shadow-float:0 0 0 .5px rgb(0 0 0 / .9), 0 8px 16px -4px rgb(0 0 0 / .5), 0 24px 56px -8px rgb(0 0 0 / .7), inset 0 1px 0 rgb(255 255 255 / .06);
  --blur:blur(24px) saturate(1.6);
  --focus:0 0 0 2px var(--bg), 0 0 0 4px var(--accent-ring);

  /* motion */
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --dur-1:120ms; --dur-2:180ms; --dur-3:280ms;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#FAFAFA; --card:#FFFFFF; --card-2:#F4F4F5; --card-3:#EDEDEF; --card-4:#FFFFFF; --sunk:#F7F7F8;
  --glass:rgb(255 255 255 / .75); --glass-strong:rgb(255 255 255 / .92); --scrim:rgb(9 9 11 / .3);
  --border:rgb(0 0 0 / .08); --border-2:rgb(0 0 0 / .12); --border-3:rgb(0 0 0 / .2); --edge:rgb(255 255 255 / .8);
  --text-1:#09090B; --text-2:#52525B; --text-3:#71717A; --text-4:#A1A1AA;
  --accent:#16A34A; --accent-hi:#15803D; --on-accent:#FFFFFF; --accent-soft:rgb(22 163 74 / .1); --accent-ring:rgb(22 163 74 / .55);
  --cyan:#0891B2; --cyan-hi:#0E7490; --red-hi:#DC2626;
  --div-mid:#F4F4F5;
  --shadow-card:0 1px 2px rgb(0 0 0 / .05);
  --shadow-float:0 0 0 .5px rgb(0 0 0 / .12), 0 8px 16px -4px rgb(0 0 0 / .08), 0 24px 56px -8px rgb(0 0 0 / .16);
}

/* ---------- 2. Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text-1);font-family:var(--font-sans);font-size:var(--fs-14);line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{text-wrap:balance}
p,li{text-wrap:pretty}
::selection{background:rgb(34 197 94 / .28);color:var(--text-1)}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:var(--focus)}
::placeholder{color:var(--text-3);opacity:1}
*{scrollbar-width:thin;scrollbar-color:var(--card-4) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--card-4);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--border-3);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
.mono,code,kbd,pre{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}
.spacer{flex:1}
.muted{color:var(--text-2)} .faint{color:var(--text-3)} .small{font-size:var(--fs-12)}
svg.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}

/* ---------- 3. App shell: sidebar + header + content ---------- */
.shell{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);height:100vh}
.sb{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--bg)}
.sb-brand{flex:none;display:flex;align-items:center;gap:12px;height:var(--hdr-h);padding:0 18px;border-bottom:1px solid var(--border);text-decoration:none}
.sb-logo{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-md);background:#FAFAFA;color:#09090B;
  box-shadow:0 0 0 1px rgb(255 255 255 / .1),0 1px 2px rgb(0 0 0 / .5),inset 0 -1px 0 rgb(0 0 0 / .12)}
:root[data-theme=light] .sb-logo{background:#09090B;color:#FAFAFA}
.sb-logo svg.ic{width:18px;height:18px;stroke-width:2}
.sb-name{font-size:var(--fs-16);font-weight:600;letter-spacing:-.015em;white-space:nowrap}
.sb-nav{display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow:auto}
.sb-sec{padding:4px 12px 8px;font-size:var(--fs-12);font-weight:500;color:var(--text-4)}
.sb-item{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:var(--r-md);text-decoration:none;
  color:var(--text-2);font-size:var(--fs-14);font-weight:500;white-space:nowrap;
  transition:background-color var(--dur-1) ease,color var(--dur-1) ease,box-shadow var(--dur-1) ease}
.sb-item svg.ic{width:18px;height:18px}
.sb-item:hover{background:var(--card-2);color:var(--text-1)}
body[data-page=catalog] .sb-item[data-nav=catalog],body[data-page=lab] .sb-item[data-nav=lab],body[data-page=constructor] .sb-item[data-nav=constructor]{
  color:var(--text-1);background:linear-gradient(180deg,rgb(34 197 94 / .07),rgb(34 197 94 / .03));
  box-shadow:inset 0 0 0 1.5px var(--accent-ring),0 0 0 3px rgb(34 197 94 / .06),0 0 18px -4px rgb(34 197 94 / .35)}
body[data-page=catalog] .sb-item[data-nav=catalog] svg,body[data-page=lab] .sb-item[data-nav=lab] svg,body[data-page=constructor] .sb-item[data-nav=constructor] svg{color:var(--accent)}
.sb-foot{margin-top:auto;padding:12px}
.sb-card{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--border)}
.sb-card-ic{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-md);background:var(--brand-grad);color:#04140A}
.sb-card b{display:block;font-size:var(--fs-13);font-weight:600}
.sb-card small{display:block;font-size:var(--fs-12);color:var(--text-3);line-height:1.4;margin-top:1px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.hdr{flex:none;display:flex;align-items:center;gap:20px;height:var(--hdr-h);padding:0 24px;border-bottom:1px solid var(--border);
  background:rgb(9 9 11 / .8);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);position:relative;z-index:5}
:root[data-theme=light] .hdr{background:rgb(250 250 250 / .8)}
.hdr-title{margin:0;font-size:var(--fs-20);font-weight:600;letter-spacing:-.025em;white-space:nowrap}
.hdr-ctx{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:var(--fs-14);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-ctx svg.ic{color:var(--text-3)}
.hdr-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.content{flex:1;min-height:0;overflow:auto;padding:24px}

/* search field with an icon */
.field-ic{position:relative;display:flex;align-items:center}
.field-ic>svg.ic{position:absolute;left:12px;color:var(--text-3);pointer-events:none}
.field-ic>input{padding-left:36px!important}

/* icon button (square) */
.icon-btn{display:inline-grid;place-items:center;width:var(--h-md);height:var(--h-md);border-radius:var(--r-md);color:var(--text-2);
  transition:background-color var(--dur-1) ease,color var(--dur-1) ease}
.icon-btn:hover{background:var(--card-2);color:var(--text-1)}
.icon-btn svg.ic{width:18px;height:18px}

/* ---------- 4. Cards ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
.card-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 0}
.card-t{margin:0;font-size:var(--fs-16);font-weight:600;letter-spacing:-.015em;color:var(--text-1)}
.card-s{margin:2px 0 0;font-size:var(--fs-13);color:var(--text-2)}
.card-b{padding:18px 22px 22px}
.card-x{margin-left:auto;display:flex;align-items:center;gap:8px}

/* KPI card */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:16px}
.kpi{position:relative;padding:20px 22px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);min-width:0}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kpi-l{font-size:var(--fs-14);color:var(--text-2);line-height:1.35}
.kpi-ic{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r-md);background:var(--card-2);border:1px solid var(--border);color:var(--text-2)}
.kpi-ic svg.ic{width:16px;height:16px}
.kpi-ic.g{color:var(--accent);background:var(--accent-soft);border-color:rgb(34 197 94 / .18)}
.kpi-ic.c{color:var(--cyan);background:var(--cyan-soft);border-color:rgb(6 182 212 / .18)}
.kpi-v{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:10px;font-size:var(--fs-32);font-weight:600;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-d{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-13);font-weight:500;letter-spacing:0;color:var(--accent)}
.kpi-d svg.ic{width:14px;height:14px}
.kpi-d.down{color:var(--red)} .kpi-d.flat{color:var(--text-3)}
.kpi-s{margin-top:8px;font-size:var(--fs-13);color:var(--text-3);line-height:1.45}

/* progress rows ("pipeline stages") */
.prog{display:flex;flex-direction:column;gap:18px}
.prog-row{display:flex;flex-direction:column;gap:9px}
.prog-h{display:flex;align-items:baseline;gap:10px;font-size:var(--fs-14)}
.prog-h .l{flex:1;color:var(--text-1);min-width:0}
.prog-h .n{margin-left:auto;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog-h .p{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:6px;border-radius:var(--r-full);background:var(--card-3);overflow:hidden}
.track>i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent));transition:width var(--dur-3) var(--ease-out)}

/* ---------- 5. Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h-md);padding:0 14px;border-radius:var(--r-md);
  font-size:var(--fs-14);font-weight:500;line-height:1;white-space:nowrap;text-decoration:none;color:var(--text-1);
  background:var(--card-2);border:1px solid var(--border-2);box-shadow:inset 0 1px 0 var(--edge);cursor:pointer;user-select:none;
  transition:background-color var(--dur-1) ease,border-color var(--dur-1) ease,color var(--dur-1) ease,transform var(--dur-1) var(--ease-out)}
.btn:hover{background:var(--card-3);border-color:var(--border-3)}
.btn:active{transform:scale(.97)}
.btn svg.ic{width:16px;height:16px}
.btn.sm{height:var(--h-sm);padding:0 12px;font-size:var(--fs-13)}
/* primary: one per view. Legacy names .orange/.primary map here */
.btn.primary,.btn.orange{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600;box-shadow:0 0 0 1px rgb(34 197 94 / .4),0 6px 20px -8px rgb(34 197 94 / .55),inset 0 1px 0 rgb(255 255 255 / .25)}
.btn.primary:hover,.btn.orange:hover{background:var(--accent-hi)}
.btn.yellow{border-color:rgb(34 197 94 / .35);color:var(--accent-hi);background:var(--accent-soft)}
.btn.yellow:hover{border-color:var(--accent-ring);background:rgb(34 197 94 / .16)}
.btn.teal{}
.btn.warm{background:transparent}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--card-2);color:var(--text-1)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-ring);color:var(--text-1)}
.btn:disabled,.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary:disabled,.btn.orange:disabled{background:var(--card-3);color:var(--text-2);box-shadow:none}

/* chips: filters and toggles; selected = the sidebar's green outline */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-full);font-size:var(--fs-13);font-weight:500;
  color:var(--text-2);background:transparent;border:1px solid var(--border-2);cursor:pointer;user-select:none;white-space:nowrap;
  transition:background-color var(--dur-1) ease,color var(--dur-1) ease,border-color var(--dur-1) ease}
.chip:hover{color:var(--text-1);background:var(--card-2)}
.chip.on{color:var(--text-1);background:var(--accent-soft);border-color:var(--accent-ring)}

/* pill: passive label */
.pill{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:var(--r-md);font-size:var(--fs-13);font-weight:500;color:var(--text-2);background:var(--card-2);border:1px solid var(--border);white-space:nowrap}
.pill svg.ic{color:var(--text-3)}

/* badge: status */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-sm);font-size:var(--fs-12);font-weight:500;white-space:nowrap;
  color:var(--text-2);background:var(--card-3);border:1px solid var(--border)}
.badge.ok{color:var(--ok-hi);background:var(--ok-soft);border-color:rgb(34 197 94 / .22)}
.badge.warn,.badge.part{color:#FBBF24;background:var(--warn-soft);border-color:rgb(245 158 11 / .22)}
.badge.bad,.badge.no{color:var(--bad-hi);background:var(--bad-soft);border-color:rgb(239 68 68 / .22)}
.badge.info,.badge.run{color:var(--cyan-hi);background:var(--info-soft);border-color:rgb(6 182 212 / .22)}
:root[data-theme=light] .badge.warn,:root[data-theme=light] .badge.part{color:#B45309}
.dot{display:inline-block;flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}

/* segmented control */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-md);background:var(--card-2);border:1px solid var(--border)}
.seg button{height:26px;padding:0 12px;border-radius:var(--r-sm);font-size:var(--fs-13);font-weight:500;color:var(--text-2);transition:background-color var(--dur-1) ease,color var(--dur-1) ease}
.seg button:hover{color:var(--text-1)}
.seg button.on{color:var(--text-1);background:var(--card-4);box-shadow:inset 0 0 0 1px var(--border-2),inset 0 1px 0 rgb(255 255 255 / .05),0 1px 2px rgb(0 0 0 / .4)}
:root[data-theme=light] .seg button.on{background:#fff;box-shadow:0 0 0 .5px rgb(0 0 0 / .12),0 1px 2px rgb(0 0 0 / .08)}

/* underline tabs (Vercel) */
.utabs{display:flex;gap:24px;border-bottom:1px solid var(--border)}
.utabs button{position:relative;height:44px;font-size:var(--fs-14);font-weight:500;color:var(--text-2);transition:color var(--dur-1) ease}
.utabs button:hover{color:var(--text-1)}
.utabs button.on{color:var(--text-1)}
.utabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}

/* switch: label.toggle > input[type=checkbox] + i */
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-13);color:var(--text-2);cursor:pointer;user-select:none}
.toggle:hover{color:var(--text-1)}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle i{position:relative;flex:none;width:32px;height:18px;border-radius:var(--r-full);background:var(--card-4);box-shadow:inset 0 0 0 1px var(--border-2);transition:background-color var(--dur-2) ease}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#D4D4D8;box-shadow:0 1px 2px rgb(0 0 0 / .5);transition:transform var(--dur-2) var(--ease-out),background-color var(--dur-2) ease}
.toggle input:checked+i{background:var(--accent);box-shadow:none}
.toggle input:checked+i::after{transform:translateX(14px);background:#fff}
.toggle input:focus-visible+i{box-shadow:var(--focus)}

/* fields */
input[type=text],input[type=number],input[type=search],input:not([type]),select,textarea{
  height:var(--h-md);padding:0 12px;border-radius:var(--r-md);border:1px solid var(--border-2);background:var(--card-2);color:var(--text-1);
  font-size:var(--fs-14);transition:border-color var(--dur-1) ease,box-shadow var(--dur-1) ease}
input[type=text]:hover,input[type=number]:hover,input:not([type]):hover,select:hover,textarea:hover{border-color:var(--border-3)}
input[type=text]:focus,input[type=number]:focus,input:not([type]):focus,select:focus,textarea:focus{border-color:var(--accent-ring);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
input[type=number]{font-variant-numeric:tabular-nums}
select{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2371717A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
select option,select optgroup{background:var(--card-2);color:var(--text-1)}
textarea{height:auto;padding:12px 14px;line-height:1.6;resize:vertical}

const FILTERS = [["all", "All"], ["atlas", "Has an atlas"], ["certified", "Certified"]];
function renderChips() {
  $("#chips").innerHTML = FILTERS.map(([k, l]) => `<button class="chip${filt === k ? " on" : ""}" data-k="${k}">${l}</button>`).join("");
  $$("#chips .chip").forEach(b => b.onclick = () => { filt = b.dataset.k; renderChips(); renderList(); });
}

function renderList() {
  const q = $("#q").value.trim().toLowerCase();
  const keep = E.map((e, i) => [e, i]).filter(([e]) =>
    (!q || (e.name + " " + e.target + " " + e.task).toLowerCase().includes(q)) &&
    (filt === "all" || (filt === "atlas" && e.atlas) || (filt === "certified" && (e.status === "complete" || e.status === "verified"))));
  $("#nShown").textContent = keep.length === E.length ? `${E.length}` : `${keep.length} of ${E.length}`;
  const groups = {};
  keep.forEach(([e, i]) => (groups[e.family || "Other"] ||= []).push([e, i]));
  $("#list").innerHTML = Object.entries(groups).map(([g, items]) => `<div class="grp${shut.has(g) ? " shut" : ""}" data-g="${esc(g)}">
    <button class="gh"><span class="chev">▼</span>${esc(g)}<span class="n">${items.length}</span></button>
    <div class="items">${items.map(([e, i]) => `<div class="entry${cur === e ? " sel" : ""}" data-i="${i}"><span class="sd ${stCls(e.status)}" title="${esc(e.status)}"></span>
      <div><div class="nm">${esc(e.name)}</div><div class="m">${e.params?.toLocaleString() ?? "?"} params · ${esc(e.status)}</div></div></div>`).join("")}</div></div>`).join("")
    || '<div class="t-empty"><span class="ei">' + ic("search") + '</span><b>No networks match</b>Try another search or filter.</div>';
  $$(".grp>.gh").forEach(b => b.onclick = () => { const g = b.parentElement.dataset.g; shut.has(g) ? shut.delete(g) : shut.add(g); b.parentElement.classList.toggle("shut"); });
  $$(".entry").forEach(d => d.onclick = () => show(+d.dataset.i));
}

async function load() {
  E = await (await fetch("/api/catalog")).json();
  const nA = E.filter(e => e.atlas).length, nC = E.filter(e => e.status === "complete" || e.status === "verified").length;
  $("#ctxT").textContent = `${E.length} networks · ${nA} with an atlas · ${nC} certified`;
  renderChips(); renderList();
  $("#q").oninput = renderList;
  const want = new URLSearchParams(location.search).get("t");
  const i = E.findIndex(e => e.target === want);
  if (E.length) show(i >= 0 ? i : Math.max(0, E.findIndex(e => e.atlas)));
}

/* ---------- the detail page ---------- */
function labelOf(x) {
  const l = x.trigger.label;
  if (!l) return "";
  return `<span class="lab ${l === "not explained" ? "not" : l}">${esc(l)}</span>`;
}

function atlasStats(a) {
  const ms = Object.values(a.matrices).flatMap(m => m.mechanisms);
  const sw = ms.filter(x => x.trigger.rule !== "always" && x.trigger.rule !== "never");
  const trusted = sw.filter(x => conf(x) >= 0.9);
  const lab = trusted.filter(x => x.trigger.label);
  return {n: ms.length, mats: Object.keys(a.matrices).length, trusted: trusted.length, sw: sw.length,
          rule: lab.filter(x => x.trigger.label === "rule").length, lookup: lab.filter(x => x.trigger.label === "lookup").length, labelled: lab.length};
}

/* one KPI card: label, icon, value, optional delta chip, sub-line */
function kpi(label, icon, value, sub, delta, tone = "") {
  return `<div class="kpi"><div class="kpi-top"><div class="kpi-l">${label}</div><span class="kpi-ic ${tone}">${ic(icon)}</span></div>
    <div class="kpi-v">${value}${delta || ""}</div>${sub ? `<div class="kpi-s">${sub}</div>` : ""}</div>`;
}
const deltaPts = (a, b, what) => { if (a == null || b == null) return ""; const d = 100 * (a - b);
  return `<span class="kpi-d ${d < -0.05 ? "down" : d > 0.05 ? "" : "flat"}" title="percentage points ${what}">${ic(d < -0.05 ? "trending-down" : "trending-up")}${d >= 0 ? "+" : ""}${d.toFixed(1)} pts</span>`; };

function tilesHTML(e) {
  const t = [];
  if (e.atlas) {
    const a = e.atlas, f = a.fidelity, s = atlasStats(a), rg = f.rule_gated_trusted_v4 ?? f.rule_gated_trusted_v3 ?? f.rule_gated_trusted;
    t.push(kpi("Rebuilt from its parts", "rotate-ccw", pct(rg), `of decisions, each part on by its rule${a.task_rule == null ? "" : ` · task rule ${pct(a.task_rule)}`}`, deltaPts(rg, a.task_rule, "above the task rule"), "g"));
    t.push(kpi("Mechanisms", "puzzle", s.n, `pieces of the weights in ${s.mats} matrices`));
    if (s.labelled)
      t.push(kpi("Understood", "brain-circuit", Math.round(100 * s.rule / s.labelled) + "%", `of trusted rules carry over (${s.rule} rule · ${s.lookup} memorized)`));
    else
      t.push(kpi("Trusted rules", "shield-check", (s.sw ? Math.round(100 * s.trusted / s.sw) : 0) + "%", `${s.trusted} of ${s.sw} rules hold on held-out inputs`));
    t.push(kpi("Parts alone", "component", pct(f.mechanisms_alone), "kept with only the listed mechanisms"));
  }
  if (e.run) t.push(kpi("Construction", "blocks", pct(e.behaviour), `same decision · ${esc(e.stages)} stages`, "", "c"));
  return t.length ? `<div class="kpis" style="grid-template-columns:repeat(${t.length},minmax(0,1fr))">${t.join("")}</div>` : "";
}

function overviewHTML(a) {
  const st = a.findings ? a.findings.statements : [];
  const f = a.fidelity;
  const rows = [["Each mechanism switched by its trusted, decision-checked rule", f.rule_gated_trusted_v4 ?? f.rule_gated_trusted_v3 ?? f.rule_gated_trusted, "var(--accent)", 1],
    ["Every rule used, trusted or not", f.rule_gated, "var(--cyan)"], ["Switched by the network's own importances", f.importance_masked, "var(--cyan)"],
    ["Only the listed mechanisms, all on", f.mechanisms_alone, "var(--violet)"], ["Every live mechanism on", f.all_alive, "var(--violet)"]];
  if (a.task_rule != null) rows.push(["The task rule alone (the network's accuracy)", a.task_rule, "var(--text-3)"]);
  return `<div class="ov"><div class="card"><div class="card-h"><div><h3 class="card-t">What the atlas finds</h3><p class="card-s">Findings stated by the atlas, in its own words</p></div></div>
    <div class="card-b"><div class="find">${st.map(x => { const m = x.match(/^(\d+[a-z]?)\. /); return `<div class="fi${/^6\./.test(x) ? " hl" : ""}"><span class="no">${m ? m[1] : "•"}</span><div>${esc(x.replace(/^\d+[a-z]?\. /, ""))}</div></div>`; }).join("") || '<p class="hint">No findings recorded.</p>'}</div></div></div>
  <div class="card"><div class="card-h"><div><h3 class="card-t">How faithful the description is</h3><p class="card-s">Behaviour kept when the network is rebuilt from its mechanisms</p></div></div>
    <div class="card-b"><div class="prog">${rows.map(([l, v, c, b]) => `<div class="prog-row"><div class="prog-h"><span class="l">${l}</span><span class="p" ${b ? 'style="color:var(--accent-hi)"' : ""}>${pct(v)}</span></div><div class="track"><i style="width:${v == null ? 0 : (100 * v).toFixed(1)}%;--c:${c}"></i></div></div>`).join("")}</div>
    <div class="src">Source: <span class="mono">${esc(a.file)}</span></div></div></div></div>`;
}

function mechRows(a) {
  const rows = [];
  for (const [k, m] of Object.entries(a.matrices)) {
    const always = m.mechanisms.filter(x => x.trigger.rule === "always");
    if (always.length) {
      const fl = always.filter(x => x.effect).map(x => x.effect.decision_flip_rate_when_needed);
      rows.push(`<tr class="always" data-m="${esc(k)}" data-l="always" data-t="${esc((k + " always " + always.map(x => x.id).join(" ")).toLowerCase())}"><td class="mono">${always.length} always-on</td><td>100%</td><td class="small">always needed: together a fixed part of ${esc(k)} (${esc(always.map(x => x.id).join(", "))})</td><td>–</td><td class="small">${fl.length ? `removing any one flips ${pct(Math.min(...fl))}–${pct(Math.max(...fl))} of decisions` : "–"}</td><td>–</td><td>–</td></tr>`);
    }
    for (const x of m.mechanisms.filter(x => x.trigger.rule !== "always").sort((p, q) => q.in_use - p.in_use)) {
      const e = x.effect || {};
      const rule = (x.trigger.task_level && x.trigger.task_level.confidence_clear >= 0.9 && x.trigger.rule !== "never") ? "task-level: " + x.trigger.task_level.rule : (x.trigger.rule_glossed || x.trigger.rule);
      const rw = x.profile_text || x.rw_text || "–";
      rows.push(`<tr data-m="${esc(k)}" data-l="${esc(x.trigger.label || (conf(x) >= 0.9 ? "trusted" : "not explained"))}" data-t="${esc((x.id + " " + rule + " " + rw).toLowerCase())}">
        <td class="mono">${esc(x.id)}</td><td>${pct(x.in_use)}</td><td class="mono">${esc(rule).replace(/\n/g, "<br>")}</td>
        <td>${conf(x).toFixed(2)}${labelOf(x)}</td>
        <td class="small">${e.effect_when_needed == null ? "–" : `flips ${pct(e.decision_flip_rate_when_needed)} of decisions; lowers class ${e.most_lowered_class}, raises ${e.most_raised_class}`}</td>
        <td>${e.specificity == null ? "–" : e.specificity >= 1e5 ? "only where needed" : e.specificity.toFixed(0) + "×"}</td>
        <td class="mono">${esc(rw)}</td></tr>`);
    }
  }
  return rows.join("");
}

function mechsHTML(a) {
  return `<div id="atlas" class="card"><div class="card-h"><div><h3 class="card-t">Mechanisms</h3><p class="card-s">Each row is one piece of the network's weights</p></div></div>
    <div class="card-b"><p class="hint"><b>Trigger</b>: when the piece is needed. <b>Confidence</b>: how well that rule predicts it on held-out inputs, with a label where checked: <span class="lab rule">rule</span> carries over to unseen inputs, <span class="lab lookup">lookup</span> only describes memorized cases. <b>Specificity</b>: how much more removing it matters where the rule says it is needed than elsewhere.</p>
    <div class="toolbar">
      <select id="fm"><option value="">All matrices</option>${Object.keys(a.matrices).map(k => `<option>${esc(k)}</option>`).join("")}</select>
      <select id="fl"><option value="">Any label</option><option value="rule">rule</option><option value="lookup">lookup</option><option value="not explained">not explained</option><option value="always">always on</option></select>
      <label class="field-ic">${ic("list-filter")}<input id="ft" placeholder="Search rules, e.g. frequency 14"></label>
      <span class="count" id="fc"></span></div>
    <div class="tw"><table class="mechs"><thead><tr><th>Mechanism</th><th>In use</th><th>Trigger</th><th>Confidence</th><th>Removing it where needed</th><th>Specificity</th><th>What it reads and writes</th></tr></thead>
    <tbody>${mechRows(a)}</tbody></table></div></div></div>`;
}

function filterMechs() {
  const m = $("#fm").value, l = $("#fl").value, t = $("#ft").value.trim().toLowerCase();
  let n = 0;
  $$("#atlas table.mechs tbody tr").forEach(r => {
    const ok = (!m || r.dataset.m === m) && (!l || r.dataset.l === l) && (!t || r.dataset.t.includes(t));
    r.style.display = ok ? "" : "none"; n += ok;
  });
  $("#fc").textContent = `${n} shown`;
}

function stepHTML() {
  return `<div class="card"><div class="card-h"><div><h3 class="card-t">Step through an input</h3><p class="card-s">The real network next to the network rebuilt from its mechanisms</p></div>
    <div class="card-x"><button class="btn primary sm" id="atlas-play">${ic("dices")}Random input</button></div></div>
    <div class="card-b"><p class="hint">A random input goes through the real network and through the network rebuilt from its mechanisms, each switched on by its trusted rule. Below: at each step, which mechanisms the rules switch on, and which the network's own importances say are needed.</p><div id="atlas-out"></div></div></div>`;
}

function constructionHTML(e) {
  const c = e.coverage || {}, un = c.unexplained || [];
  return `<div class="stack"><div class="card"><div class="card-h"><div><h3 class="card-t">What the construction says the network does</h3><p class="card-s">The construction's own description</p></div></div><div class="card-b"><div class="prose">${esc(e.description || "(no description in the file)")}</div></div></div>
  <div class="grid2">
    <div class="card"><div class="card-h"><div><h3 class="card-t">Certificate</h3><p class="card-s">What the judge measured</p></div></div><div class="card-b"><table class="kv">${certRows(e)}</table></div></div>
    <div class="card"><div class="card-h"><div><h3 class="card-t">Not explained</h3><p class="card-s">What the tests found the construction misses</p></div></div><div class="card-b">${un.length ? "<ul>" + un.map(u => `<li>${esc(u)}</li>`).join("") + "</ul>" : '<div class="t-empty" style="padding:24px 8px"><span class="ei">' + ic("circle-check") + '</span>Nothing found by the tests.</div>'}
      ${e.fails.length ? `<h3 class="sub">Why it isn't certified</h3><ul>${e.fails.map(f => `<li class="small">${esc(f)}</li>`).join("")}</ul>` : ""}</div></div></div>
  <div class="card"><div class="card-h"><div><h3 class="card-t">Playground</h3><p class="card-s">Run the network and the construction side by side</p></div></div><div class="card-b">${e.playable ? playgroundHTML() : '<p class="hint">The playground runs weight-level networks; language-model constructions are shown with their certificate only.</p>'}</div></div>
  <div class="card"><div class="card-b"><details><summary>The construction (Python)</summary><pre>${esc(e.source)}</pre></details>
  <details><summary>The judge's full report</summary><pre>${esc(e.report)}</pre></details></div></div></div>`;
}

function certRows(e) {
  const c = e.coverage || {};
  const rows = [["Verdict", `<span class="badge ${stBadge(e.status)}">${esc(e.status)}</span> <div class="faint" style="font-weight:400;font-size:var(--fs-12);margin-top:4px">judged by ${esc(e.judged_by)}</div>`], ["Stages explained", e.stages],
    ["Behaviour (same decision as the network)", pct(e.behaviour)], ["All named sites replaced at once", pct(c.joint)],
    ["Worst slice", pct(c.worst_slice)], ["Network's own mistakes reproduced", pct(c.errors_reproduced)],
    ["How it was written", esc(e.written || "")], ["Runs of the constructor on this network", e.runs], ["Cost of this run", e.cost == null ? "–" : "$" + e.cost.toFixed(2) + ` (${e.steps} steps)`]];
  return rows.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("");
}

function show(i) {
  cur = E[i];
  $$(".entry").forEach(d => d.classList.toggle("sel", +d.dataset.i === i));
  history.replaceState(null, "", "?t=" + cur.target);
  const tabs = [];
  if (cur.atlas) tabs.push(["overview", "Overview", overviewHTML(cur.atlas)], ["mechs", "Mechanisms", mechsHTML(cur.atlas)], ["step", "Step through", stepHTML()]);
  if (cur.run) tabs.push(["cons", "Construction", constructionHTML(cur)]);
  if (cur.unit_map) tabs.push(["parts", "Parts (unit map)", `<div class="card"><div class="card-b">${partsHTML(cur.unit_map)}</div></div>`]);
  $("#detail").innerHTML = `<div class="d-head"><div style="flex:1;min-width:0">
      <div class="crumb">${ic("layers")}${esc(cur.family)}</div>
      <h2 class="d-title">${esc(cur.name)}</h2><div class="d-sub">Trained on: <b>${esc(cur.task)}</b></div>
      <div class="ids"><span class="tag">${esc(cur.target)}</span><span class="tag">${cur.params?.toLocaleString() ?? "?"} parameters</span>${cur.run ? `<span class="tag">run ${esc(cur.run)}</span>` : ""}</div></div>
      <span class="badge ${stBadge(cur.status)}"><span class="dot"></span>${esc(cur.status)}</span></div>
    ${tilesHTML(cur)}
    ${tabs.length ? `<div class="utabs tabs">${tabs.map(([k, l], j) => `<button data-k="${k}" class="${j ? "" : "on"}">${l}</button>`).join("")}</div>
      ${tabs.map(([k, , h], j) => `<div class="panel${j ? "" : " on"}" data-k="${k}">${h}</div>`).join("")}` : '<div class="card"><div class="t-empty"><span class="ei">' + ic("box") + '</span><b>Nothing built yet</b>No atlas or construction exists for this network.</div></div>'}`;
  $$(".tabs button").forEach(b => b.onclick = () => {
    $$(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    $$(".panel").forEach(p => p.classList.toggle("on", p.dataset.k === b.dataset.k));
  });
  if (cur.atlas) { ["#fm", "#fl"].forEach(s => $(s).onchange = filterMechs); $("#ft").oninput = filterMechs; filterMechs(); $("#atlas-play").onclick = atlasPlay; }
  if (cur.run && cur.playable) { $("#run").onclick = () => play(); $("#rand").onclick = () => play(true); $("#swap").onclick = () => play(false, true); play(true); }
  $("#detail").scrollTop = 0;
  const sel = $(".entry.sel"); if (sel) sel.scrollIntoView({block: "nearest"});
}

async function atlasPlay() {
  $("#atlas-out").innerHTML = '<p class="hint">Running…</p>';
  const r = await (await fetch(`/api/catalog/${cur.target}/atlas_play`, {method: "POST", body: JSON.stringify({seed: Math.floor(Math.random() * 1e9)})})).json();
  if (r.error) { $("#atlas-out").innerHTML = `<p class="hint">${esc(r.error)}</p>`; return; }
  const rows = r.calls.map(c => `<tr><td>${esc(c.at)}</td><td class="mono">${esc(c.matrix)}</td><td class="mono">${esc(c.on_by_trigger.join(", ") || "–")}</td><td class="mono">${esc(c.on_by_importance.join(", ") || "–")}</td></tr>`).join("");
  const same = r.network_decision === r.rebuilt_decision;
  $("#atlas-out").innerHTML = `<div class="kpis" style="margin-bottom:0">${kpi("Network's answer", "cpu", r.network_decision, "", "", "c")}${kpi("Rebuilt from mechanisms", "rotate-ccw", r.rebuilt_decision, "", "", "g")}</div>
    <div class="agree-row"><span class="agree ${same ? "y" : "n"}">${same ? "They agree" : "They differ"}</span><span class="mono faint">input ${esc(JSON.stringify(r.x))}</span></div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>Where</th><th>Matrix</th><th>Switched on by rules</th><th>Needed by importance</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function partsHTML(u) {
  if (!u) return "";
  const f2 = v => v == null ? "–" : v.toFixed(2), sub = u.cells.filter(x => x.substitution_grade != null);
  return `<div id="parts"><h3 class="card-t">Parts (unit map)</h3>
  <p class="hint" style="margin-top:6px">What each hidden neuron computes, as far as a library of simple units can say. A unit is a single ReLU of a few simple quantities (the current input, the previous input, the running max, 2nd max or min). Each part is fitted on half of the inputs and scored on the other half.</p>
  <table class="kv"><tr><th>Neuron-steps explained (held-out R² ≥ 0.9), units that use the input history</th><td>${f2(u.coverage_history)} (same network with shuffled weights: ${f2(u.control_history)})</td></tr>
  <tr><th>Neuron-steps explained by raw-input units</th><td>${f2(u.coverage_raw)} (shuffled: ${f2(u.control_raw)})</td></tr>
  <tr><th>Precision the network needs (ε95)</th><td>${u.eps95 == null ? "–" : (100 * u.eps95).toFixed(2) + "%"}: noise of this size (as a share of each neuron's spread) flips 5% of the network's decisions</td></tr>
  <tr><th>Substitution-grade parts (error ≤ ε95)</th><td>${sub.length ? u.substitution_grade + " of " + u.cells.length + " neuron-steps" : "–"}</td></tr>
  <tr><th>Replaceable parts</th><td>${u.replaceable ? `${(100 * u.replaceable.share_after_step1).toFixed(0)}% of the network's activity after step 1 (${u.replaceable.n} neuron-steps). Replacing them all at once keeps ${pct(u.replaceable.joint_fidelity)} of decisions; the task rule alone keeps ${pct(u.replaceable.task_rule)}.` : "–"}</td></tr></table>
  <h3 class="sub">Per neuron</h3><p class="hint">The most common label over the steps where the neuron is explained.</p>
  <div class="tw"><table class="neurons"><thead><tr><th>Neuron</th><th>Label</th></tr></thead><tbody>${u.per_unit.map(r => `<tr><td>${r.neuron}</td><td class="mono">${esc(r.label)}</td></tr>`).join("")}</tbody></table></div>
  <details style="margin-top:14px"><summary>Every neuron-step (${u.cells.length})</summary>
  <p class="hint" style="margin-top:8px">Fit: held-out R² of the unit. Sufficiency: decisions kept when this one neuron-step is replaced by its unit. Importance: decisions lost when it is set to its mean. Relative error: the unit's error as a share of the neuron's spread.</p>
  <div class="tw"><table><thead><tr><th>Step</th><th>Neuron</th><th>Unit</th><th>Fit</th><th>Sufficiency</th><th>Importance</th><th>Relative error</th><th>Substitution-grade</th></tr></thead><tbody>
  ${u.cells.map(x => `<tr><td>${x.t}</td><td>${x.unit}</td><td class="mono">${esc(x.label || "")}</td><td>${x.fit == null ? "–" : x.fit.toFixed(3)}</td><td>${pct(x.sufficiency)}</td><td>${pct(x.importance)}</td><td>${x.rel_error == null ? "–" : x.rel_error.toFixed(3)}</td><td>${x.substitution_grade == null ? "–" : x.substitution_grade ? "yes" : "no"}</td></tr>`).join("")}
  </tbody></table></div></details>
  <p class="src">Source: <span class="mono">${esc(u.file)}</span> (lab/unitmap.py). Read only.</p></div>`;
}

function playgroundHTML() {
  return `<p class="hint">Type an input (comma-separated numbers), or leave it empty for a random one. Then compare the network with the construction, or take one of the construction's variables from another input: the construction predicts what the network will do when that variable is changed inside it, and the network shows what it actually does.</p>
  <div class="pg-in"><label class="field-ic">${ic("hash")}<input class="x" id="xin" placeholder="random"></label><button class="btn primary sm" id="run">${ic("play")}Run this input</button><button class="btn sm" id="rand">${ic("dices")}Random input</button></div>
  <div class="pg-in"><span class="lbl">Variable</span><select id="var"></select><button class="btn sm" id="swap">${ic("shuffle")}Take it from a random other input</button></div>
  <div id="out"></div>`;
}

function valsHTML(o, c = "var(--cyan)") {
  const v = o.values, top = o.decision;
  return `<div class="vals" style="--c:${c}">${v.map((a, j) => `<span class="${top.includes(j) && v.length > 1 && j === v.indexOf(Math.max(...v)) ? "top" : ""}" title="${j}: ${a}" style="height:${Math.max(3, 82 * (a - Math.min(...v)) / ((Math.max(...v) - Math.min(...v)) || 1))}px"></span>`).join("")}</div>
  <div class="vals-d">decision ${esc(JSON.stringify(o.decision))}</div>`;
}

async function play(random = false, swap = false) {
  const txt = $("#xin").value.trim();
  const body = {};
  if (!random && txt) body.x = txt.split(/[\s,]+/).map(Number);
  if (random) body.seed = Math.floor(Math.random() * 1e9);
  if (swap) { body.x = txt ? txt.split(/[\s,]+/).map(Number) : undefined; body.swap = {variable: $("#var").value}; body.seed = Math.floor(Math.random() * 1e9); }
  const r = await fetch(`/api/catalog/${cur.target}/${cur.run}/play`, {method: "POST", body: JSON.stringify(body)});
  const d = await r.json();
  if (d.error) { $("#out").innerHTML = `<p class="bad">${esc(d.error)}</p>`; return; }
  $("#xin").value = d.x.join(", ");
  const sel = $("#var"), was = sel.value;
  sel.innerHTML = d.variables.filter(v => v.sites.length).map(v => `<option${v.name === was ? " selected" : ""}>${esc(v.name)}</option>`).join("");
  let h = `<div class="grid2"><div><div class="chart-l"><span class="dot" style="color:var(--cyan)"></span>Network</div>${valsHTML(d.network, "var(--cyan)")}</div><div><div class="chart-l"><span class="dot" style="color:var(--accent)"></span>Construction</div>${valsHTML(d.construction, "var(--accent)")}</div></div>
  <div class="agree-row"><span class="agree ${d.agree ? "y" : "n"}">${d.agree ? "Same decision" : "Different decisions"}</span></div>
  <div class="tw" style="margin-top:12px"><table><thead><tr><th>Variable</th><th>Value on this input</th><th>Lives at</th></tr></thead><tbody>${d.variables.map(v => `<tr><td class="mono">${esc(v.name)}</td><td class="mono">${esc(JSON.stringify(v.value))}</td><td class="mono">${esc(v.sites.join(", ") || "not placed")}</td></tr>`).join("")}</tbody></table></div>`;
  if (d.swap) {
    const s = d.swap;
    h = `<h3 class="sub" style="margin-top:4px">Intervention: <span class="mono">${esc(s.variable)}</span> at <span class="mono">${esc(s.site)}</span>, taken from input [${esc(s.source_x.join(", "))}] (value ${esc(JSON.stringify(s.source_value))})</h3>
    <div class="grid2"><div><div class="chart-l"><span class="dot" style="color:var(--accent)"></span>The construction predicts</div>${valsHTML(s.construction_predicts, "var(--accent)")}</div><div><div class="chart-l"><span class="dot" style="color:var(--cyan)"></span>The network actually does</div>${valsHTML(s.network_after, "var(--cyan)")}</div></div>
    <div class="agree-row"><span class="agree ${s.prediction_right ? "y" : "n"}">${s.prediction_right ? "Prediction right" : "Prediction wrong"}</span></div><hr>` + h;
  }
  $("#out").innerHTML = h;
}
load();
</script>
</body>
</html>
