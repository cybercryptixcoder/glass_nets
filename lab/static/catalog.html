  const trusted = sw.filter(x => conf(x) >= 0.9);
  const lab = trusted.filter(x => x.trigger.label);
  return {n: ms.length, mats: Object.keys(a.matrices).length, trusted: trusted.length, sw: sw.length, always: ms.filter(x => x.trigger.rule === "always").length,
          rule: lab.filter(x => x.trigger.label === "rule").length, lookup: lab.filter(x => x.trigger.label === "lookup").length, labelled: lab.length};
}
const labelOf = x => { const l = x.trigger.label; return l ? `<span class="lab ${l === "not explained" ? "not" : l}">${esc(l)}</span>` : (conf(x) >= 0.9 ? '<span class="lab trusted">trusted</span>' : '<span class="lab not">not explained</span>'); };
const cardHead = (icon, tone, title, sub, extra = "") => `<div class="card-h"><span class="ibox ${tone}">${ic(icon)}</span><div class="grow"><h3 class="card-t">${title}</h3>${sub ? `<p class="card-s">${sub}</p>` : ""}</div>${extra}</div>`;
const subOpen = (k, title) => `<button class="card-open" data-sub="${k}" title="${title}">${ic("external-link")}</button>`;

/* ---------- the detail: one network, as cards ---------- */
function show(i) {
  cur = E[i]; steps = [];
  $("#browse").hidden = true; $("#detail").hidden = false;
  $("#pickName").textContent = cur.name; renderList();
  history.replaceState(null, "", "?t=" + cur.target);
  const a = cur.atlas;
  let h = `<div class="view-o" data-v="overview"><div class="grid">${heroCard()}`;
  if (a) h += faithCard(a) + findingsCard(a) + mechCard(a) + stepCard();
  if (cur.run) h += consCard(a ? "s7" : "s12");
  if (cur.unit_map) h += partsCard(cur.unit_map);
  if (cur.decomp?.report) h += decompCard(cur.decomp);
  if (cur.decomp?.factor) h += factorCard(cur.decomp.factor);
  if (cur.decomp?.pow) h += powCard(cur.decomp.pow);
  if (!a && !cur.run && !cur.unit_map && !cur.decomp) h += `<div class="card s5"><div class="t-empty"><span class="ei">${ic("box")}</span><b>Nothing built yet</b>No atlas or construction exists for this network.</div></div>`;
  h += `</div></div>`;
  if (a) h += `<div class="view-o" data-v="mechs" hidden>${mechsView(a)}</div>`;
  if (cur.run && cur.playable) h += `<div class="view-o" data-v="play" hidden>${playView()}</div>`;
  if (cur.unit_map) h += `<div class="view-o" data-v="parts" hidden>${partsView(cur.unit_map)}</div>`;
  $("#detail").innerHTML = h;
  hydrateIcons($("#detail"));
  $$("#detail [data-sub]").forEach(b => b.onclick = () => sub(b.dataset.sub));
  if (a) {
    $("#fm").onchange = $("#fl").onchange = () => { LIMIT = 30; filterMechs(); };
    $("#ft").oninput = () => { LIMIT = 30; filterMechs(); }; LIMIT = 30; filterMechs();
    $("#mMore").onclick = () => { LIMIT += 60; filterMechs(); };
    $$("#atlas table.mechs tbody tr").forEach(r => r.onclick = () => r.classList.toggle("open"));
    $("#atlas-play").onclick = atlasPlay;
    $("#allFind").onclick = () => openSheet({kicker: ic("sparkles") + esc(cur.name), title: "What the atlas finds", html: `<div class="find">${(a.findings ? a.findings.statements : []).map(findCard).join("")}</div><p class="hint">Source: <span class="mono">${esc(a.file)}</span></p>`});
    $("#faithMore").onclick = () => { const m = $("#faithRest"); m.hidden = !m.hidden; $("#faithMore").textContent = m.hidden ? "Show every measure" : "Show fewer"; };
  }
  if (cur.run) {
    $("#certBtn").onclick = certSheet;
    $("#codeBtn").onclick = () => openSheet({kicker: ic("file-code") + esc(cur.name), title: "The construction (Python)", wide: true, html: `<pre>${esc(cur.source)}</pre>`});
    $("#repBtn").onclick = () => openSheet({kicker: ic("scroll-text") + esc(cur.name), title: "The judge's full report", wide: true, html: `<pre>${esc(cur.report)}</pre>`});
    if (cur.playable) { $("#run").onclick = () => play(); $("#rand").onclick = () => play(true); $("#swap").onclick = () => play(false, true); }
  }
  if (cur.decomp?.report && $("#progBtn")) $("#progBtn").onclick = () => openSheet({kicker: ic("file-code") + esc(cur.name), title: "The decompiled program (Python)", wide: true,
    html: `<p class="hint">Every table in this program was read from the network's weights; the network's outputs were used only to check it.</p><pre>${esc(cur.decomp.program || "(no program)")}</pre>`});
  if (cur.decomp?.report && $("#decRepBtn")) $("#decRepBtn").onclick = () => openSheet({kicker: ic("scroll-text") + esc(cur.name), title: "The decompiler's report", wide: true, html: `<pre>${esc(JSON.stringify(cur.decomp.report, null, 1))}</pre>`});
  if (cur.decomp?.factor && $("#facRepBtn")) $("#facRepBtn").onclick = () => { const f = Object.assign({}, cur.decomp.factor); delete f.partition_a; delete f.partition_b; delete f.kept_a; delete f.kept_b; openSheet({kicker: ic("scroll-text") + esc(cur.name), title: "Factor mode report (lab/decomp/factorize.py)", wide: true, html: `<pre>${esc(JSON.stringify(f, null, 1))}</pre>`}); };
  if (cur.decomp?.pow && $("#powRepBtn")) $("#powRepBtn").onclick = () => openSheet({kicker: ic("scroll-text") + esc(cur.name), title: "Mechanism tests (scripts/decomp/pow_mechanism.py)", wide: true, html: `<pre>${esc(JSON.stringify(cur.decomp.pow, null, 1))}</pre>`});
  fitMore($("#detail"));
  $(".content").scrollTop = 0;
}

/* ---------- D1: the decompiler ---------- */
function decompCard(dc) {
  const r = dc.report, sc = dc.score;
  const row = (l, v, c, b) => `<div class="prog-row"><div class="prog-h"><span class="l">${l}</span><span class="p" ${b ? 'style="color:var(--accent-hi)"' : ""}>${pct(v)}</span></div><div class="track"><i style="width:${v == null ? 0 : (100 * v).toFixed(1)}%;--c:${c}"></i></div></div>`;
  if (!r.group) return `<div class="card s5">${cardHead("binary", "c", "Decompiler", "Weights in, program out (blind)")}<div class="card-b"><p>${esc(r.verdict)}</p><p class="hint">The inputs carry no group law. That is the right answer for a memorizer, and for a task that is not a group law (like a^b, where the split card below shows what the network does instead).</p></div><div class="card-f"><button class="link-btn" id="decRepBtn">The report</button></div></div>`;
  const pass = r.verdict.startsWith("PASS");
  if (!Array.isArray(r.group)) {          // orbit mode (non-abelian, or abelian via the orbit fallback): a Cayley table
    const n = r.n_symbols, nm2 = r.group_name || r.group;
    return `<div class="card s7">${cardHead("binary", "g", "Decompiled program", "Read from the weights alone: no task, no symbol meanings, no feature list",
        `<span class="badge ${pass ? "ok" : ""}">${pass ? "passes" : "fails"}</span>`)}
      <div class="card-b">
        <p>The symbols are the ${n} elements of a group: <b>${esc(String(nm2))}</b>. The program is its ${n} × ${n} composition table, read from the rotations that permute the symbols' orbit (${esc(r.a_side?.variant || "")}).</p>
        <p class="hint">${r.element_orders ? "Element orders: " + esc(Object.entries(r.element_orders).map(([k, v]) => v + " of order " + k).join(", ")) + ". " : ""}Which symbol is the identity, and left versus right, were chosen by agreement with the network among ${r.candidates_selected_by_M1 ?? "?"} candidates.</p>
        <div class="prog">${row("Program agrees with the network (all inputs)", r.M1?.agreement, "var(--accent)", 1)}
          ${row(`Causal: moving one input's coordinates moves the answer as predicted (${r.M2?.where || ""})`, r.M2?.success, "var(--cyan)")}
          ${row("Same test, random subspace of the same size (control)", r.M2_random_control?.success, "var(--text-3)")}
          ${sc ? row("Checked afterwards against the hidden answer key", sc.law_vs_truth, "var(--violet)") : ""}</div>
      </div>
      <div class="card-f"><button class="btn sm" id="progBtn">${ic("file-code")}Read the program</button><button class="link-btn" id="decRepBtn">The report</button></div></div>`;
  }
  const G = "Z" + r.group.map(x => `<sub>${x}</sub>`).join(" × Z");
  const nm = r.a_side?.name, nmb = r.b_side?.name;
  return `<div class="card s7">${cardHead("binary", "g", "Decompiled program", "Read from the weights alone: no task, no symbol meanings, no feature list",
      `<span class="badge ${pass ? "ok" : ""}">${pass ? "passes" : "fails"}</span>`)}
    <div class="card-b">
      <p>The symbols are elements of the group <b>${G}</b>${r.order ? ` (${r.order} elements)` : ""}, and the network adds them there: <span class="mono">c = CLASS_OF[ g(a) + g(b) ]</span>.</p>
      ${nm ? `<p class="hint">Name found for the symbol map: <span class="mono">${esc(nm)}</span>${nmb && nmb !== nm ? `; second input: <span class="mono">${esc(nmb)}</span>` : ""}</p>` : `<p class="hint">No closed form fits the symbol map: it is an arbitrary relabelling, recovered as a table.</p>`}
      <div class="prog">${row("Program agrees with the network (all inputs)", r.M1?.agreement, "var(--accent)", 1)}
        ${row(`Causal: moving one input's coordinates moves the answer as predicted (${r.M2?.where || ""})`, r.M2?.success, "var(--cyan)")}
        ${row("Same test, random subspace of the same size (control)", r.M2_random_control?.success, "var(--text-3)")}
        ${sc ? row("Checked afterwards against the hidden answer key", sc.law_vs_truth, "var(--violet)") : ""}</div>
    </div>
    <div class="card-f"><button class="btn sm" id="progBtn">${ic("file-code")}Read the program</button><button class="link-btn" id="decRepBtn">The report</button></div></div>`;
}
function factorCard(fc) {
  const ok = (fc.verdict || "").startsWith("SPLITS"), st = fc.split_test || {};
  const row = (l, v, c) => `<div class="prog-row"><div class="prog-h"><span class="l">${l}</span><span class="p">${pct(v)}</span></div><div class="track"><i style="width:${v == null ? 0 : (100 * v).toFixed(1)}%;--c:${c}"></i></div></div>`;
  const parts = (fc.parts || []).map((p, i) => `<li><b>Part ${i + 1}</b>: ${p.a_blocks} × ${p.b_blocks} blocks → ${p.values} values${p.fingerprint?.matches?.length ? `: <b>${esc(p.fingerprint.matches.join(", "))}</b>` : ""}${p.fingerprint?.invertible_core?.group ? `; invertible core: ${esc(p.fingerprint.invertible_core.group)}` : ""}</li>`).join("");
  return `<div class="card s7">${cardHead("git-branch", "v", "Hidden split into independent sub-computations", "Found blind from the network's activations: no task, no number theory supplied",
      `<span class="badge ${ok ? "ok" : ""}">${ok ? "splits" : "no clean split"}</span>`)}
    <div class="card-b"><p>${esc(fc.verdict || "")}</p>${parts ? `<ul class="findings">${parts}</ul>` : ""}
      ${st.argmax_agreement != null ? `<div class="prog">${row(`The sum of the part tables gives the network's answer (all ${st.inputs} inputs; ${st.table_entries} table entries)`, st.argmax_agreement, "var(--accent)")}${row("Share of the network's logits the part tables explain", st.logit_share_explained, "var(--cyan)")}</div>` : ""}
    </div><div class="card-f"><button class="link-btn" id="facRepBtn">The report</button></div></div>`;
}
function powCard(pw) {
  const t4 = Object.entries(pw.T4_crt_swaps || {}), t5 = Object.entries(pw.T5_unit_factor_swaps || {});
  const row = (l, v) => `<div class="prog-row"><div class="prog-h"><span class="l">${esc(l)}</span><span class="p">${pct(v)}</span></div><div class="track"><i style="width:${v == null ? 0 : (100 * v).toFixed(1)}%;--c:var(--cyan)"></i></div></div>`;
  return `<div class="card s5">${cardHead("sigma", "c", "How it computes a^b: nested logarithms", `p = ${pw.p}; exponents live in Z<sub>${pw.p_minus_1}</sub> = ${pw.crt_parts.map(q => "Z<sub>" + q + "</sub>").join(" × ")}`)}
    <div class="card-b"><p class="clamp" style="--lines:4">The network takes x = log(a), splits the exponent ring by the Chinese remainder theorem into its prime-power parts, and inside each part stores a residue by its multiplicative structure (a second logarithm). Swapping one part of one input inside the network moves the answer exactly as that predicts.</p>
      <div class="prog">${t4.map(([k, v]) => row(`swap ${k}`, v.success)).join("")}${t5.slice(0, 3).map(([k, v]) => row(k.replace("b mod", "second log, b mod"), v.success)).join("")}</div></div>
    <div class="card-f"><button class="link-btn" id="powRepBtn">All tests</button></div></div>`;
}
function sub(k) {
  $$("#detail .view-o").forEach(v => v.hidden = v.dataset.v !== k);
  $(".content").scrollTop = 0;
  if (k === "play" && !$("#out").innerHTML) play(true);
}
const back = () => `<button class="btn sm" data-sub="overview">${ic("chevron-right", "flip")}Overview</button>`;

function heroCard() {
  const e = cur, acts = [];
  if (e.atlas) acts.push(`<button class="btn sm white" data-sub="mechs">${ic("puzzle")}Browse mechanisms</button>`);
  if (e.run && e.playable) acts.push(`<button class="btn sm" data-sub="play">${ic("play")}Playground</button>`);
  if (e.unit_map) acts.push(`<button class="btn sm" data-sub="parts">${ic("component")}Parts</button>`);
  return `<div class="hero-card s7"><span class="badge"><span class="dot"></span>${esc(e.status)}</span>
    <div class="k">${ic("layers")}${esc(e.family)}</div><h2>${esc(e.name)}</h2><p>Trained on: ${esc(e.task)}</p>
    <div class="hc-tags"><span class="hc-tag">${esc(e.target)}</span><span class="hc-tag">${e.params?.toLocaleString() ?? "?"} parameters</span></div>
    <div class="hc-actions">${acts.join("")}</div></div>`;
}

function faithCard(a) {
  const f = a.fidelity, head = f.rule_gated_trusted_v4 ?? f.rule_gated_trusted_v3 ?? f.rule_gated_trusted;
  const row = (l, v, c, b) => `<div class="prog-row"><div class="prog-h"><span class="l">${l}</span><span class="p" ${b ? 'style="color:var(--accent-hi)"' : ""}>${pct(v)}</span></div><div class="track"><i style="width:${v == null ? 0 : (100 * v).toFixed(1)}%;--c:${c}"></i></div></div>`;
  const rest = [["Every rule used, trusted or not", f.rule_gated, "var(--cyan)"], ["Switched by the network's own importances", f.importance_masked, "var(--cyan)"],
    ["Only the listed mechanisms, all on", f.mechanisms_alone, "var(--violet)"], ["Every live mechanism on", f.all_alive, "var(--violet)"]];
  return `<div class="card s5">${cardHead("target", "g", "How faithful", "Decisions kept when rebuilt from its parts",
      `<span class="tipi r" tabindex="0" data-tip="The network is rebuilt from the atlas's mechanisms, each switched on by its trusted rule, and run on held-out inputs. The bar is the share of the network's own decisions the rebuild reproduces. The task rule is the reference: how often the task's true answer matches the network.">${ic("circle-help")}</span>`)}
    <div class="card-b"><div class="prog">${row("Rebuilt, each part switched by its trusted rule", head, "var(--accent)", 1)}${a.task_rule != null ? row("Task rule alone (the network's accuracy)", a.task_rule, "var(--text-3)") : ""}
    <div class="prog" id="faithRest" hidden>${rest.map(r => row(...r)).join("")}</div></div></div>
    <div class="card-f"><button class="link-btn" id="faithMore">Show every measure</button></div></div>`;
}

const findCard = (x, j) => { const m = x.match(/^(\d+[a-z]?)\. /); return `<div class="fcard${/^6\./.test(x) ? " hl" : ""}"><span class="no">${m ? m[1] : "•"}</span><div>${esc(x.replace(/^\d+[a-z]?\. /, ""))}</div></div>`; };
function findingsCard(a) {
  const st = a.findings ? a.findings.statements : [];
  const key = st.find(x => /^6\./.test(x)) || st[0];
  const others = st.filter(x => x !== key).slice(0, 2);
  return `<div class="card s7">${cardHead("sparkles", "c", "What the atlas finds", `${st.length} findings, in the atlas's own words`, `<button class="see-all" id="allFind">See all${ic("chevron-right")}</button>`)}
    <div class="card-b"><div class="find">${key ? findCard(key).replace('<div>', '<div class="clamp" style="--lines:3">') : '<p class="hint">No findings recorded.</p>'}${others.map(x => findCard(x).replace('<div>', '<div class="clamp">')).join("")}</div></div></div>`;
}

function mechCard(a) {
  const s = atlasStats(a), top = Object.values(a.matrices).flatMap(m => m.mechanisms).filter(x => x.trigger.rule !== "always" && x.trigger.rule !== "never").sort((p, q) => q.in_use - p.in_use).slice(0, 3);
  const ms = [["Switching", s.sw], ["Trusted rule", s.trusted], ["Always on", s.always]];
  if (s.labelled) ms.push(["Carries over", s.rule]);
  return `<div class="card s5">${cardHead("puzzle", "", "Mechanisms", `${s.n} pieces of the weights in ${s.mats} matrices`, subOpen("mechs", "Browse all mechanisms"))}
    <div class="card-b" style="display:flex;flex-direction:column;gap:12px"><div class="mstats">${ms.map(([l, v]) => `<div class="mstat"><span class="l">${l}</span><span class="v">${v}</span></div>`).join("")}</div>
    <div style="display:flex;flex-direction:column;gap:6px">${top.map(x => `<div class="mrow"><span class="id">${esc(x.id)}</span><span class="tr" title="${esc(x.trigger.rule_glossed || x.trigger.rule)}">${esc(x.trigger.rule_glossed || x.trigger.rule)}</span><span class="u">${pct(x.in_use)}</span></div>`).join("")}</div></div>
    <div class="card-f"><button class="btn sm" data-sub="mechs">${ic("list")}Browse all ${s.n}</button></div></div>`;
}

function stepCard() {
  return `<div class="card s5">${cardHead("dices", "", "Try an input", "The real network next to its rebuild",
      `<span class="tipi r" tabindex="0" data-tip="A random input goes through the real network and through the network rebuilt from its mechanisms, each switched on by its trusted rule. The steps show which mechanisms the rules switch on, and which the network's own importances say are needed.">${ic("circle-help")}</span>`)}
    <div class="card-b"><div id="atlas-out"><div class="t-empty" style="padding:20px 8px"><span class="ei">${ic("dices")}</span>Run one input to compare the two.</div></div></div>
    <div class="card-f"><button class="btn primary sm" id="atlas-play">${ic("play")}Random input</button><button class="link-btn" id="stepsTog" hidden>Show the steps</button></div></div>`;
}

function consCard(span) {
  const e = cur, c = e.coverage || {}, ok = e.status === "complete";
  const acts = [`<button class="btn sm" id="certBtn">${ic("shield-check")}Certificate</button>`];
  if (e.playable) acts.push(`<button class="btn sm" data-sub="play">${ic("play")}Playground</button>`);
  acts.push(`<button class="btn sm" id="codeBtn">${ic("file-code")}Code</button>`, `<button class="btn sm ghost" id="repBtn">${ic("scroll-text")}Judge's report</button>`);
  return `<div class="card ${span}${ok ? " feat" : ""}">${cardHead("blocks", "c", "Construction", "What the constructor says the network does", `<span class="badge ${stBadge(e.status)}"><span class="dot"></span>${esc(e.status)}</span>`)}
    <div class="card-b" style="display:flex;flex-direction:column;gap:14px">
      <div class="facts"><span class="pill">${ic("layers")}${esc(e.stages)} stages</span><span class="pill">${ic("target")}${pct(e.behaviour)} same decision</span>${(c.unexplained || []).length ? `<span class="pill">${ic("triangle-alert")}${c.unexplained.length} not explained</span>` : ""}</div>
      <div><div class="desc clamp" id="consDesc">${esc(e.description || "(no description in the file)")}</div><button class="link-btn g" data-more="consDesc" style="margin-top:6px">Read the full description</button></div></div>
    <div class="card-f">${acts.join("")}</div></div>`;
}
function certSheet() {
  const e = cur, c = e.coverage || {}, un = c.unexplained || [];
  const rows = [["Verdict", `${esc(e.status)} · judged by ${esc(e.judged_by)}`], ["Stages explained", e.stages], ["Same decision as the network", pct(e.behaviour)], ["All named sites replaced at once", pct(c.joint)],
    ["Worst slice", pct(c.worst_slice)], ["Network's own mistakes reproduced", pct(c.errors_reproduced)], ["How it was written", esc(e.written || "–")], ["Constructor runs on this network", e.runs],
    ["Cost of this run", e.cost == null ? "–" : "$" + e.cost.toFixed(2) + ` (${e.steps} steps)`]];
  openSheet({kicker: ic("shield-check") + esc(cur.name), title: "Certificate",
    html: `<div class="mstats" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">${rows.map(([l, v]) => `<div class="mstat"><span class="l">${l}</span><span class="v">${v}</span></div>`).join("")}</div>
      <div class="sec-h" style="margin:16px 2px 0"><h3>Not explained</h3><small>${un.length}</small></div>
      ${un.length ? un.map(u => `<div class="icard in"><div class="icard-h"><span class="ibox o">${ic("triangle-alert")}</span><div class="icard-x">${esc(u)}</div></div></div>`).join("") : `<div class="icard in"><div class="icard-h"><span class="ibox g">${ic("circle-check")}</span><div class="icard-x">The tests found nothing the construction misses.</div></div></div>`}
      ${e.fails.length ? `<div class="sec-h" style="margin:16px 2px 0"><h3>Why it isn't certified</h3></div>${e.fails.map(f => `<div class="icard in"><div class="icard-h"><span class="ibox r">${ic("circle-x")}</span><div class="icard-x">${esc(f)}</div></div></div>`).join("")}` : ""}`});
}

function partsCard(u) {
  const f2 = v => v == null ? "–" : v.toFixed(2);
  return `<div class="card s12">${cardHead("component", "v", "Parts (unit map)", "What each hidden neuron computes, as far as a library of simple units can say", subOpen("parts", "Open the parts"))}
    <div class="card-b"><div class="mstats" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
      <div class="mstat"><span class="l">Explained, with input history</span><span class="v">${f2(u.coverage_history)} <span class="faint">(shuffled ${f2(u.control_history)})</span></span></div>
      <div class="mstat"><span class="l">Precision needed (ε95)</span><span class="v">${u.eps95 == null ? "–" : (100 * u.eps95).toFixed(2) + "%"}</span></div>
      <div class="mstat"><span class="l">Substitution-grade parts</span><span class="v">${u.substitution_grade ?? "–"} of ${u.cells.length}</span></div>
      <div class="mstat"><span class="l">Neurons</span><span class="v">${u.per_unit.length}</span></div></div></div></div>`;
}

/* ---------- mechanisms (a view of cards, with search and a filter menu) ---------- */
function mechRows(a) {
  const rows = [];
  for (const [k, m] of Object.entries(a.matrices)) {
    const always = m.mechanisms.filter(x => x.trigger.rule === "always");
    if (always.length) {
      const fl = always.filter(x => x.effect).map(x => x.effect.decision_flip_rate_when_needed);
      rows.push(`<tr class="always" data-m="${esc(k)}" data-l="always" data-t="${esc((k + " always " + always.map(x => x.id).join(" ")).toLowerCase())}"><td class="m-id">${always.length} always-on in ${esc(k)}</td><td class="m-use">always</td>
        <td class="m-trig" data-k="Trigger"><div class="clamp">always needed: a fixed part of ${esc(k)} (${esc(always.map(x => x.id).join(", "))})</div></td><td class="m-conf" data-k="Label"><span class="lab always">always on</span></td><td class="m-spec" data-k="Specificity">–</td>
        <td class="m-eff" data-k="Removing one">${fl.length ? `flips ${pct(Math.min(...fl))}–${pct(Math.max(...fl))} of decisions` : "–"}</td><td class="m-rw" data-k="Reads and writes">–</td></tr>`);
    }
    for (const x of m.mechanisms.filter(x => x.trigger.rule !== "always").sort((p, q) => q.in_use - p.in_use)) {
      const e = x.effect || {};
      const rule = (x.trigger.task_level && x.trigger.task_level.confidence_clear >= 0.9 && x.trigger.rule !== "never") ? "task-level: " + x.trigger.task_level.rule : (x.trigger.rule_glossed || x.trigger.rule);
      const rw = x.profile_text || x.rw_text || "–";
      rows.push(`<tr data-m="${esc(k)}" data-l="${esc(x.trigger.label || (conf(x) >= 0.9 ? "trusted" : "not explained"))}" data-t="${esc((x.id + " " + rule + " " + rw).toLowerCase())}">
        <td class="m-id">${esc(x.id)}</td><td class="m-use">in use ${pct(x.in_use)}</td>
        <td class="m-trig" data-k="Trigger"><div class="clamp">${esc(rule).replace(/\n/g, "<br>")}</div></td>
        <td class="m-conf" data-k="Confidence">${conf(x).toFixed(2)} ${labelOf(x)}</td>
        <td class="m-spec" data-k="Specificity">${e.specificity == null ? "–" : e.specificity >= 1e5 ? "only where needed" : e.specificity.toFixed(0) + "×"}</td>
        <td class="m-eff" data-k="Removing it where needed">${e.effect_when_needed == null ? "–" : `flips ${pct(e.decision_flip_rate_when_needed)} of decisions; lowers class ${e.most_lowered_class}, raises ${e.most_raised_class}`}</td>
        <td class="m-rw" data-k="What it reads and writes">${esc(rw)}</td></tr>`);
    }
  }
  return rows.join("");
}
function mechsView(a) {
  const s = atlasStats(a);
  return `<div class="vbar">${back()}<h2>Mechanisms</h2><span class="sub">${s.n} in ${s.mats} matrices</span>
      <span class="tipi" tabindex="0" data-tip="Each card is one piece of the network's weights. Trigger: when the piece is needed. Confidence: how well that rule predicts it on held-out inputs. rule = carries over to unseen inputs; lookup = only describes memorized cases. Specificity: how much more removing it matters where the rule says it is needed than elsewhere. Click a card for its effect and what it reads and writes.">${ic("circle-help")}</span></div>
    <div id="atlas"><div class="toolbar">
      <label class="field-ic">${ic("search")}<input id="ft" placeholder="Search rules, e.g. frequency 14"></label>
      <details class="pop l"><summary class="btn sm">${ic("list-filter")}Filter${ic("chevron-down", "chev")}</summary>
        <div class="pop-b" style="min-width:280px"><div class="pop-row">Matrix<select id="fm"><option value="">All matrices</option>${Object.keys(a.matrices).map(k => `<option>${esc(k)}</option>`).join("")}</select></div>
        <div class="pop-row">Label<select id="fl"><option value="">Any label</option><option value="rule">rule</option><option value="lookup">lookup</option><option value="trusted">trusted</option><option value="not explained">not explained</option><option value="always">always on</option></select></div></div></details>
      <span class="count" id="fc"></span></div>
    <table class="mechs"><thead><tr><th>Mechanism</th><th>In use</th><th>Trigger</th><th>Confidence</th><th>Specificity</th><th>Removing it where needed</th><th>What it reads and writes</th></tr></thead><tbody>${mechRows(a)}</tbody></table>
    <div class="more-row"><button class="btn" id="mMore">${ic("plus")}Show more</button></div></div>`;
}
function filterMechs() {
  const m = $("#fm").value, l = $("#fl").value, t = $("#ft").value.trim().toLowerCase();
  let n = 0;
  $$("#atlas table.mechs tbody tr").forEach(r => {
    const ok = (!m || r.dataset.m === m) && (!l || r.dataset.l === l) && (!t || r.dataset.t.includes(t));
    r.style.display = ok ? "" : "none"; if (ok) n++;
    r.classList.toggle("over", ok && n > LIMIT);
  });
  $("#fc").textContent = n > LIMIT ? `${LIMIT} of ${n} shown` : `${n} shown`;
  $("#mMore").parentElement.hidden = n <= LIMIT;
}

/* ---------- step through ---------- */
async function atlasPlay() {
  $("#atlas-play").disabled = true;
  const r = await (await fetch(`/api/catalog/${cur.target}/atlas_play`, {method: "POST", body: JSON.stringify({seed: Math.floor(Math.random() * 1e9)})})).json();
  $("#atlas-play").disabled = false;
  if (r.error) { $("#atlas-out").innerHTML = `<p class="hint">${esc(r.error)}</p>`; return; }
  const same = r.network_decision === r.rebuilt_decision;
  $("#atlas-out").innerHTML = `<div class="duo"><div class="ans"><div class="l">${ic("cpu")}Network</div><div class="v">${esc(r.network_decision)}</div></div><div class="ans"><div class="l">${ic("rotate-ccw")}Rebuilt</div><div class="v">${esc(r.rebuilt_decision)}</div></div></div>
    <div class="row" style="margin-top:12px"><span class="agree ${same ? "y" : "n"}">${same ? "They agree" : "They differ"}</span><span class="mono faint" style="overflow-wrap:anywhere">input ${esc(JSON.stringify(r.x))}</span></div>
    <div class="steps" id="steps">${r.calls.map(c => `<div class="scard"><span class="w">${esc(c.at)}<br>${esc(c.matrix)}</span><span class="a"><b>rules</b>${esc(c.on_by_trigger.join(", ") || "–")}</span><span class="b"><b>importance</b>${esc(c.on_by_importance.join(", ") || "–")}</span></div>`).join("")}</div>`;
  const t = $("#stepsTog"); t.hidden = false; t.textContent = `Show the ${r.calls.length} steps`;
  t.onclick = () => { const s = $("#steps"); s.classList.toggle("open"); t.textContent = s.classList.contains("open") ? "Hide the steps" : `Show the ${r.calls.length} steps`; };
}

/* ---------- parts (a view) ---------- */
function partsView(u) {
  const f2 = v => v == null ? "–" : v.toFixed(2), sub = u.cells.filter(x => x.substitution_grade != null);
  return `<div class="vbar">${back()}<h2>Parts</h2><span class="sub">unit map, read only</span>
      <span class="tipi" tabindex="0" data-tip="A unit is a single ReLU of a few simple quantities (the current input, the previous input, the running max, 2nd max or min). Each part is fitted on half of the inputs and scored on the other half.">${ic("circle-help")}</span></div>
    <div id="parts"><div class="mstats" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">
      <div class="mstat"><span class="l">Neuron-steps explained (held-out R² ≥ 0.9), units that use the input history</span><span class="v">${f2(u.coverage_history)} (same network with shuffled weights: ${f2(u.control_history)})</span></div>
      <div class="mstat"><span class="l">Neuron-steps explained by raw-input units</span><span class="v">${f2(u.coverage_raw)} (shuffled: ${f2(u.control_raw)})</span></div>
      <div class="mstat"><span class="l">Precision the network needs (ε95)</span><span class="v">${u.eps95 == null ? "–" : (100 * u.eps95).toFixed(2) + "%"}: noise of this size flips 5% of decisions</span></div>
      <div class="mstat"><span class="l">Substitution-grade parts (error ≤ ε95)</span><span class="v">${sub.length ? u.substitution_grade + " of " + u.cells.length + " neuron-steps" : "–"}</span></div>
      <div class="mstat"><span class="l">Replaceable parts</span><span class="v">${u.replaceable ? `${(100 * u.replaceable.share_after_step1).toFixed(0)}% of the network's activity after step 1 (${u.replaceable.n} neuron-steps). Replacing them all at once keeps ${pct(u.replaceable.joint_fidelity)} of decisions; the task rule alone keeps ${pct(u.replaceable.task_rule)}.` : "–"}</span></div></div>
    <div class="sec-h" style="margin-top:24px"><h3>Per neuron</h3><small>the most common label where the neuron is explained</small></div>
    <table class="neurons"><thead><tr><th>Neuron</th><th>Label</th></tr></thead><tbody>${u.per_unit.map(r => `<tr><td>${r.neuron}</td><td class="mono">${esc(r.label)}</td></tr>`).join("")}</tbody></table>
    <div class="card" style="margin-top:24px"><div class="card-b"><details><summary>Every neuron-step (${u.cells.length})</summary>
      <p class="hint" style="margin:10px 0">Fit: held-out R² of the unit. Sufficiency: decisions kept when this one neuron-step is replaced by its unit. Importance: decisions lost when it is set to its mean. Relative error: the unit's error as a share of the neuron's spread.</p>
      <div class="tw"><table><thead><tr><th>Step</th><th>Neuron</th><th>Unit</th><th>Fit</th><th>Sufficiency</th><th>Importance</th><th>Relative error</th><th>Substitution-grade</th></tr></thead><tbody>
      ${u.cells.map(x => `<tr><td>${x.t}</td><td>${x.unit}</td><td class="mono">${esc(x.label || "")}</td><td>${x.fit == null ? "–" : x.fit.toFixed(3)}</td><td>${pct(x.sufficiency)}</td><td>${pct(x.importance)}</td><td>${x.rel_error == null ? "–" : x.rel_error.toFixed(3)}</td><td>${x.substitution_grade == null ? "–" : x.substitution_grade ? "yes" : "no"}</td></tr>`).join("")}
      </tbody></table></div></details></div></div>
    <p class="hint" style="margin-top:12px">Source: <span class="mono">${esc(u.file)}</span> (lab/unitmap.py)</p></div>`;
}

/* ---------- playground (a view) ---------- */
function playView() {
  return `<div class="vbar">${back()}<h2>Playground</h2><span class="sub">the network and the construction, side by side</span>
      <span class="tipi" tabindex="0" data-tip="Type an input (comma-separated numbers), or leave it empty for a random one. To test the construction, take one of its variables from another input: the construction predicts what the network will do when that variable is changed inside it, and the network shows what it actually does.">${ic("circle-help")}</span></div>
    <div class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:12px">
      <div class="pg-in"><label class="field-ic">${ic("hash")}<input class="x" id="xin" placeholder="random"></label><button class="btn primary sm" id="run">${ic("play")}Run this input</button><button class="btn sm" id="rand">${ic("dices")}Random</button></div>
      <div class="pg-in"><span class="hint">Intervene on</span><select id="var"></select><button class="btn sm" id="swap">${ic("shuffle")}Take it from another input</button></div></div></div>
    <div id="out" style="margin-top:16px"></div>`;
}
function valsHTML(o, c) {
  const v = o.values, top = o.decision;
  return `<div class="vals" style="--c:${c}">${v.map((a, j) => `<span class="${top.includes(j) && v.length > 1 && j === v.indexOf(Math.max(...v)) ? "top" : ""}" title="${j}: ${a}" style="height:${Math.max(3, 92 * (a - Math.min(...v)) / ((Math.max(...v) - Math.min(...v)) || 1))}px"></span>`).join("")}</div>
  <div class="vals-d">decision ${esc(JSON.stringify(o.decision))}</div>`;
}
const chartCard = (title, o, c) => `<div class="card"><div class="card-h"><span class="ibox ${c === "var(--accent)" ? "g" : "c"}">${ic(c === "var(--accent)" ? "blocks" : "cpu")}</span><div class="grow"><h3 class="card-t">${title}</h3></div></div><div class="card-b" style="padding-top:4px">${valsHTML(o, c)}</div></div>`;
async function play(random = false, swap = false) {
  const txt = $("#xin").value.trim();
  const body = {};
  if (!random && txt) body.x = txt.split(/[\s,]+/).map(Number);
  if (random) body.seed = Math.floor(Math.random() * 1e9);
  if (swap) { body.x = txt ? txt.split(/[\s,]+/).map(Number) : undefined; body.swap = {variable: $("#var").value}; body.seed = Math.floor(Math.random() * 1e9); }
  const r = await fetch(`/api/catalog/${cur.target}/${cur.run}/play`, {method: "POST", body: JSON.stringify(body)});
  const d = await r.json();
  if (d.error) { $("#out").innerHTML = `<div class="icard in"><div class="icard-h"><span class="ibox r">${ic("circle-x")}</span><div class="icard-x">${esc(d.error)}</div></div></div>`; return; }
  $("#xin").value = d.x.join(", ");
  const sel = $("#var"), was = sel.value;
  sel.innerHTML = d.variables.filter(v => v.sites.length).map(v => `<option${v.name === was ? " selected" : ""}>${esc(v.name)}</option>`).join("");
  let h = "";
  if (d.swap) {
    const s = d.swap;
    h += `<div class="sec-h"><h3>Intervention</h3><small><span class="mono">${esc(s.variable)}</span> at <span class="mono">${esc(s.site)}</span>, taken from [${esc(s.source_x.join(", "))}]</small><span class="agree ${s.prediction_right ? "y" : "n"}" style="margin-left:auto">${s.prediction_right ? "Prediction right" : "Prediction wrong"}</span></div>
      <div class="cgrid" style="--min:320px;margin-bottom:24px">${chartCard("The construction predicts", s.construction_predicts, "var(--accent)")}${chartCard("The network actually does", s.network_after, "var(--cyan)")}</div>`;
  }
  h += `<div class="sec-h"><h3>This input</h3><span class="agree ${d.agree ? "y" : "n"}" style="margin-left:auto">${d.agree ? "Same decision" : "Different decisions"}</span></div>
    <div class="cgrid" style="--min:320px">${chartCard("Network", d.network, "var(--cyan)")}${chartCard("Construction", d.construction, "var(--accent)")}</div>
    <div class="sec-h" style="margin-top:24px"><h3>Variables</h3><small>${d.variables.length}</small></div>
    <div class="cgrid" style="--min:220px">${d.variables.map(v => `<div class="icard vcard"><div class="icard-t mono">${esc(v.name)}</div><div class="v">${esc(JSON.stringify(v.value))}</div><div class="s">${esc(v.sites.join(", ") || "not placed")}</div></div>`).join("")}</div>`;
  $("#out").innerHTML = h;
}
load();
</script>
</body>
</html>
