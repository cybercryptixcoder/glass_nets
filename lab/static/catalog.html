/* @theme:begin (generated by sync_theme.py; do not edit here) */
/* ==========================================================================
   Glass Networks theme, v3 (Nov 20, 2026, A51: cards and progressive disclosure; v2 was A50). The single source of truth for how the lab looks.
   References: Linear (density, zinc neutrals, hairlines), Raycast (lit edges, floating glass),
   Vercel Geist (type, materials), and Shreyas's SalesOps dashboard reference (app shell, KPI cards, accents).
   Rules: docs/design/THEME.md.  Research: docs/design/UI_RESEARCH.md.

   Inlined into each page by:   python3 lab/static/sync_theme.py   (never edit the copies)
   Fonts each page loads:       Geist (300..700), Geist Mono (400..600) from Google Fonts
   ========================================================================== */

/* ---------- 1. Tokens (dark is the design; light is supported) ---------- */
:root{
  color-scheme:dark;
  --font-sans:"Geist","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* surfaces: zinc near-black; far is darker, near is lighter */
  --bg:#09090B;            /* page, sidebar, header */
  --card:#111114;          /* cards */
  --card-2:#17171B;        /* inputs, icon boxes, hover, cards inside cards */
  --card-3:#1D1D22;        /* selected, tracks */
  --card-4:#26262C;        /* raised thumb, hover on selected */
  --sunk:#0B0B0D;          /* code, logs, wells */
  --glass:rgb(17 17 19 / .72);
  --glass-strong:rgb(15 15 17 / .9);
  --scrim:rgb(0 0 0 / .6);

  /* hairlines */
  --border:rgb(255 255 255 / .075);
  --border-2:rgb(255 255 255 / .11);
  --border-3:rgb(255 255 255 / .18);
  --edge:rgb(255 255 255 / .04);       /* inner top light on cards */

  /* text */
  --text-1:#F4F4F5; --text-2:#A1A1AA; --text-3:#71717A; --text-4:#52525B;

  /* accents: green leads (actions, selection, good), cyan second (data, info) */
  --accent:#22C55E; --accent-hi:#4ADE80; --on-accent:#04140A;
  --accent-soft:rgb(34 197 94 / .1); --accent-ring:rgb(34 197 94 / .6);
  --cyan:#06B6D4; --cyan-hi:#22D3EE; --cyan-soft:rgb(6 182 212 / .12);
  --orange:#F97316; --orange-soft:rgb(249 115 22 / .12);
  --amber:#F59E0B; --amber-soft:rgb(245 158 11 / .12);
  --red:#EF4444; --red-hi:#F87171; --red-soft:rgb(239 68 68 / .12);
  --violet:#8B5CF6; --violet-soft:rgb(139 92 246 / .12);
  --brand-grad:linear-gradient(135deg,#22C55E 0%,#06B6D4 100%);
  /* status (meaning) */
  --ok:var(--accent); --ok-hi:var(--accent-hi); --ok-soft:var(--accent-soft);
  --warn:var(--amber); --warn-soft:var(--amber-soft);
  --bad:var(--red); --bad-hi:var(--red-hi); --bad-soft:var(--red-soft);
  --info:var(--cyan); --info-soft:var(--cyan-soft);

  /* data: diverging orange <-> cyan, neutral midpoint (validated: CVD dE 21, both in the dark band). Hex: canvas reads these. */
  --div-neg:#E8601C; --div-pos:#0E9FBF; --div-mid:#18181B;

  /* type scale */
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px; --fs-18:18px; --fs-20:20px; --fs-24:24px; --fs-32:32px;

  /* shape */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:999px;
  --h-sm:30px; --h-md:36px;
  --sb-w:248px; --hdr-h:64px;

  /* depth */
  --shadow-card:inset 0 1px 0 var(--edge), 0 1px 2px rgb(0 0 0 / .4);
  --shadow-float:0 0 0 .5px rgb(0 0 0 / .9), 0 8px 16px -4px rgb(0 0 0 / .5), 0 24px 56px -8px rgb(0 0 0 / .7), inset 0 1px 0 rgb(255 255 255 / .06);
  --blur:blur(24px) saturate(1.6);
  --focus:0 0 0 2px var(--bg), 0 0 0 4px var(--accent-ring);

  /* motion */
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --dur-1:120ms; --dur-2:180ms; --dur-3:280ms;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#FAFAFA; --card:#FFFFFF; --card-2:#F4F4F5; --card-3:#EDEDEF; --card-4:#FFFFFF; --sunk:#F7F7F8;
  --glass:rgb(255 255 255 / .75); --glass-strong:rgb(255 255 255 / .92); --scrim:rgb(9 9 11 / .3);
  --pop-bg:rgb(255 255 255 / .98);
  --border:rgb(0 0 0 / .08); --border-2:rgb(0 0 0 / .12); --border-3:rgb(0 0 0 / .2); --edge:rgb(255 255 255 / .8);
  --text-1:#09090B; --text-2:#52525B; --text-3:#71717A; --text-4:#A1A1AA;
  --accent:#16A34A; --accent-hi:#15803D; --on-accent:#FFFFFF; --accent-soft:rgb(22 163 74 / .1); --accent-ring:rgb(22 163 74 / .55);
  --cyan:#0891B2; --cyan-hi:#0E7490; --red-hi:#DC2626;
  --div-mid:#F4F4F5;
  --shadow-card:0 1px 2px rgb(0 0 0 / .05);
  --shadow-float:0 0 0 .5px rgb(0 0 0 / .12), 0 8px 16px -4px rgb(0 0 0 / .08), 0 24px 56px -8px rgb(0 0 0 / .16);
}

/* ---------- 2. Base ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text-1);font-family:var(--font-sans);font-size:var(--fs-14);line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{text-wrap:balance}
p,li{text-wrap:pretty}
::selection{background:rgb(34 197 94 / .28);color:var(--text-1)}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:var(--focus)}
::placeholder{color:var(--text-3);opacity:1}
*{scrollbar-width:thin;scrollbar-color:var(--card-4) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--card-4);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--border-3);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
.mono,code,kbd,pre{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}
.spacer{flex:1}
.muted{color:var(--text-2)} .faint{color:var(--text-3)} .small{font-size:var(--fs-12)}
svg.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
svg.ic.flip{transform:scaleX(-1)}

/* ---------- 3. App shell: sidebar + header + content ---------- */
.shell{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);height:100vh}
.sb{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--bg)}
.sb-brand{flex:none;display:flex;align-items:center;gap:12px;height:var(--hdr-h);padding:0 18px;border-bottom:1px solid var(--border);text-decoration:none}
.sb-logo{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-md);background:#FAFAFA;color:#09090B;
  box-shadow:0 0 0 1px rgb(255 255 255 / .1),0 1px 2px rgb(0 0 0 / .5),inset 0 -1px 0 rgb(0 0 0 / .12)}
:root[data-theme=light] .sb-logo{background:#09090B;color:#FAFAFA}
.sb-logo svg.ic{width:18px;height:18px;stroke-width:2}
.sb-name{font-size:var(--fs-16);font-weight:600;letter-spacing:-.015em;white-space:nowrap}
.sb-nav{display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow:auto}
.sb-sec{padding:4px 12px 8px;font-size:var(--fs-12);font-weight:500;color:var(--text-4)}
.sb-item{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:var(--r-md);text-decoration:none;
  color:var(--text-2);font-size:var(--fs-14);font-weight:500;white-space:nowrap;
  transition:background-color var(--dur-1) ease,color var(--dur-1) ease,box-shadow var(--dur-1) ease}
.sb-item svg.ic{width:18px;height:18px}
.sb-item:hover{background:var(--card-2);color:var(--text-1)}
body[data-page=catalog] .sb-item[data-nav=catalog],body[data-page=lab] .sb-item[data-nav=lab],body[data-page=constructor] .sb-item[data-nav=constructor]{
  color:var(--text-1);background:linear-gradient(180deg,rgb(34 197 94 / .07),rgb(34 197 94 / .03));
  box-shadow:inset 0 0 0 1.5px var(--accent-ring),0 0 0 3px rgb(34 197 94 / .06),0 0 18px -4px rgb(34 197 94 / .35)}
body[data-page=catalog] .sb-item[data-nav=catalog] svg,body[data-page=lab] .sb-item[data-nav=lab] svg,body[data-page=constructor] .sb-item[data-nav=constructor] svg{color:var(--accent)}
.sb-foot{margin-top:auto;padding:12px}
.sb-card{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--border)}
.sb-card-ic{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-md);background:var(--brand-grad);color:#04140A}
.sb-card b{display:block;font-size:var(--fs-13);font-weight:600}
.sb-card small{display:block;font-size:var(--fs-12);color:var(--text-3);line-height:1.4;margin-top:1px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.hdr{flex:none;display:flex;align-items:center;gap:20px;height:var(--hdr-h);padding:0 24px;border-bottom:1px solid var(--border);
  background:rgb(9 9 11 / .8);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);position:relative;z-index:5}
:root[data-theme=light] .hdr{background:rgb(250 250 250 / .8)}
.hdr-title{margin:0;font-size:var(--fs-20);font-weight:600;letter-spacing:-.025em;white-space:nowrap}
.hdr-ctx{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:var(--fs-14);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-ctx svg.ic{color:var(--text-3)}
.hdr-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.content{flex:1;min-height:0;overflow:auto;padding:24px}

/* search field with an icon */
.field-ic{position:relative;display:flex;align-items:center}
.field-ic>svg.ic{position:absolute;left:12px;color:var(--text-3);pointer-events:none}
.field-ic>input{padding-left:36px!important}

/* icon button (square) */
.icon-btn{display:inline-grid;place-items:center;width:var(--h-md);height:var(--h-md);border-radius:var(--r-md);color:var(--text-2);
  transition:background-color var(--dur-1) ease,color var(--dur-1) ease}
.icon-btn:hover{background:var(--card-2);color:var(--text-1)}
.icon-btn svg.ic{width:18px;height:18px}

/* ---------- 4. Cards ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-card)}
.card-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 0}
.card-t{margin:0;font-size:var(--fs-16);font-weight:600;letter-spacing:-.015em;color:var(--text-1)}
.card-s{margin:2px 0 0;font-size:var(--fs-13);color:var(--text-2)}
.card-b{padding:18px 22px 22px}
.card-x{margin-left:auto;display:flex;align-items:center;gap:8px}

/* progress rows ("pipeline stages") */
.prog{display:flex;flex-direction:column;gap:18px}
.prog-row{display:flex;flex-direction:column;gap:9px}
.prog-h{display:flex;align-items:baseline;gap:10px;font-size:var(--fs-14)}
.prog-h .l{flex:1;color:var(--text-1);min-width:0}
.prog-h .n{margin-left:auto;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog-h .p{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:6px;border-radius:var(--r-full);background:var(--card-3);overflow:hidden}
.track>i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent));transition:width var(--dur-3) var(--ease-out)}

/* ---------- 5. Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h-md);padding:0 14px;border-radius:var(--r-md);
  font-size:var(--fs-14);font-weight:500;line-height:1;white-space:nowrap;text-decoration:none;color:var(--text-1);
  background:var(--card-2);border:1px solid var(--border-2);box-shadow:inset 0 1px 0 var(--edge);cursor:pointer;user-select:none;
  transition:background-color var(--dur-1) ease,border-color var(--dur-1) ease,color var(--dur-1) ease,transform var(--dur-1) var(--ease-out)}
.btn:hover{background:var(--card-3);border-color:var(--border-3)}
.btn:active{transform:scale(.97)}
.btn svg.ic{width:16px;height:16px}
.btn.sm{height:var(--h-sm);padding:0 12px;font-size:var(--fs-13)}
/* primary: one per view. Legacy names .orange/.primary map here */
.btn.primary,.btn.orange{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600;box-shadow:0 0 0 1px rgb(34 197 94 / .4),0 6px 20px -8px rgb(34 197 94 / .55),inset 0 1px 0 rgb(255 255 255 / .25)}
.btn.primary:hover,.btn.orange:hover{background:var(--accent-hi)}
.btn.yellow{border-color:rgb(34 197 94 / .35);color:var(--accent-hi);background:var(--accent-soft)}
.btn.yellow:hover{border-color:var(--accent-ring);background:rgb(34 197 94 / .16)}
.btn.teal{}
.btn.warm{background:transparent}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--card-2);color:var(--text-1)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-ring);color:var(--text-1)}
.btn:disabled,.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary:disabled,.btn.orange:disabled{background:var(--card-3);color:var(--text-2);box-shadow:none}

/* chips: filters and toggles; selected = the sidebar's green outline */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-full);font-size:var(--fs-13);font-weight:500;
  color:var(--text-2);background:transparent;border:1px solid var(--border-2);cursor:pointer;user-select:none;white-space:nowrap;
  transition:background-color var(--dur-1) ease,color var(--dur-1) ease,border-color var(--dur-1) ease}
.chip:hover{color:var(--text-1);background:var(--card-2)}
.chip.on{color:var(--text-1);background:var(--accent-soft);border-color:var(--accent-ring)}

/* pill: passive label */
.pill{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:var(--r-md);font-size:var(--fs-13);font-weight:500;color:var(--text-2);background:var(--card-2);border:1px solid var(--border);white-space:nowrap}
.pill svg.ic{color:var(--text-3)}

/* badge: status */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-sm);font-size:var(--fs-12);font-weight:500;white-space:nowrap;
  color:var(--text-2);background:var(--card-3);border:1px solid var(--border)}
.badge.ok{color:var(--ok-hi);background:var(--ok-soft);border-color:rgb(34 197 94 / .22)}
.badge.warn,.badge.part{color:#FBBF24;background:var(--warn-soft);border-color:rgb(245 158 11 / .22)}
.badge.bad,.badge.no{color:var(--bad-hi);background:var(--bad-soft);border-color:rgb(239 68 68 / .22)}
.badge.info,.badge.run{color:var(--cyan-hi);background:var(--info-soft);border-color:rgb(6 182 212 / .22)}
:root[data-theme=light] .badge.warn,:root[data-theme=light] .badge.part{color:#B45309}
.dot{display:inline-block;flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}

/* segmented control */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-md);background:var(--card-2);border:1px solid var(--border)}
.seg button{height:26px;padding:0 12px;border-radius:var(--r-sm);font-size:var(--fs-13);font-weight:500;color:var(--text-2);transition:background-color var(--dur-1) ease,color var(--dur-1) ease}
.seg button:hover{color:var(--text-1)}
.seg button.on{color:var(--text-1);background:var(--card-4);box-shadow:inset 0 0 0 1px var(--border-2),inset 0 1px 0 rgb(255 255 255 / .05),0 1px 2px rgb(0 0 0 / .4)}
:root[data-theme=light] .seg button.on{background:#fff;box-shadow:0 0 0 .5px rgb(0 0 0 / .12),0 1px 2px rgb(0 0 0 / .08)}

/* underline tabs (Vercel) */
.utabs{display:flex;gap:24px;border-bottom:1px solid var(--border)}
.utabs button{position:relative;height:44px;font-size:var(--fs-14);font-weight:500;color:var(--text-2);transition:color var(--dur-1) ease}
.utabs button:hover{color:var(--text-1)}
.utabs button.on{color:var(--text-1)}
.utabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}

/* switch: label.toggle > input[type=checkbox] + i */
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-13);color:var(--text-2);cursor:pointer;user-select:none}
.toggle:hover{color:var(--text-1)}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle i{position:relative;flex:none;width:32px;height:18px;border-radius:var(--r-full);background:var(--card-4);box-shadow:inset 0 0 0 1px var(--border-2);transition:background-color var(--dur-2) ease}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#D4D4D8;box-shadow:0 1px 2px rgb(0 0 0 / .5);transition:transform var(--dur-2) var(--ease-out),background-color var(--dur-2) ease}
.toggle input:checked+i{background:var(--accent);box-shadow:none}
.toggle input:checked+i::after{transform:translateX(14px);background:#fff}
.toggle input:focus-visible+i{box-shadow:var(--focus)}

/* fields */
input[type=text],input[type=number],input[type=search],input:not([type]),select,textarea{
  height:var(--h-md);padding:0 12px;border-radius:var(--r-md);border:1px solid var(--border-2);background:var(--card-2);color:var(--text-1);
  font-size:var(--fs-14);transition:border-color var(--dur-1) ease,box-shadow var(--dur-1) ease}
input[type=text]:hover,input[type=number]:hover,input:not([type]):hover,select:hover,textarea:hover{border-color:var(--border-3)}
input[type=text]:focus,input[type=number]:focus,input:not([type]):focus,select:focus,textarea:focus{border-color:var(--accent-ring);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
input[type=number]{font-variant-numeric:tabular-nums}
select{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2371717A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
select option,select optgroup{background:var(--card-2);color:var(--text-1)}
textarea{height:auto;padding:12px 14px;line-height:1.6;resize:vertical}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:16px;height:16px;margin:0;border-radius:var(--r-xs);background:var(--card-2);
  border:1px solid var(--border-3);cursor:pointer;display:inline-grid;place-content:center;transition:background-color var(--dur-1) ease,border-color var(--dur-1) ease}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";width:8px;height:4px;margin-top:-2px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg)}

/* disclosure */
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text-2);font-weight:500;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";flex:none;width:6px;height:6px;margin:0 3px 0 1px;border-right:1.75px solid currentColor;border-bottom:1.75px solid currentColor;transform:rotate(-45deg);transition:transform var(--dur-2) var(--ease-out)}
details[open]>summary::before{transform:rotate(45deg)}
details>summary:hover{color:var(--text-1)}

/* code */
pre{font-family:var(--font-mono);font-size:var(--fs-12);line-height:1.65;color:var(--text-1);background:var(--sunk);border:1px solid var(--border);
  border-radius:var(--r-md);padding:12px 14px;margin:0;overflow:auto;tab-size:4}
code{font-family:var(--font-mono);font-size:.9em;padding:1px 6px;border-radius:var(--r-xs);background:var(--card-3);color:var(--text-1)}
pre code{padding:0;background:none}

/* tables */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}
th{font-size:var(--fs-12);font-weight:500;color:var(--text-3);white-space:nowrap}
td{font-size:var(--fs-14)}
tbody tr:last-child td{border-bottom:0}

/* floating glass: drawers, dialogs, tooltips */
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--border-2);box-shadow:var(--shadow-float)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-strong)}}
@media (prefers-reduced-transparency:reduce){.glass,.hdr{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* empty state */
.t-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 20px;text-align:center;color:var(--text-3)}
.t-empty .ei{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-lg);background:var(--card-2);border:1px solid var(--border);color:var(--text-2)}
.t-empty .ei svg.ic{width:20px;height:20px}
.t-empty b{color:var(--text-1);font-size:var(--fs-14);font-weight:600}

/* ---------- 5b. Cards everywhere, and progressive disclosure ---------- */
/* featured card: a gradient edge (green to cyan), one per view at most */
.card.feat{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,rgb(34 197 94 / .9),rgb(6 182 212 / .55) 45%,rgb(255 255 255 / .08) 75%) border-box}
/* hero card: the gradient card of the view (the subject's identity) */
.hero-card{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:24px 24px 22px;color:#fff;isolation:isolate;
  background:radial-gradient(120% 120% at 100% 0%,rgb(34 211 238 / .5),transparent 55%),radial-gradient(90% 120% at 0% 100%,rgb(34 197 94 / .45),transparent 60%),linear-gradient(135deg,#0B5D3B 0%,#0C4A5E 100%);
  box-shadow:0 24px 48px -24px rgb(6 182 212 / .5),inset 0 1px 0 rgb(255 255 255 / .18),inset 0 0 0 1px rgb(255 255 255 / .08)}
.hero-card::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgb(255 255 255 / .14);box-shadow:0 0 0 28px rgb(255 255 255 / .03),0 0 0 56px rgb(255 255 255 / .02);z-index:-1}
.hero-card .k{font-size:var(--fs-12);color:rgb(255 255 255 / .7);display:flex;align-items:center;gap:6px}
.hero-card h2{margin:8px 0 4px;font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.25}
.hero-card p{margin:0;color:rgb(255 255 255 / .78);font-size:var(--fs-14)}
.hero-card .hc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.hero-card .hc-tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:var(--r-sm);font-family:var(--font-mono);font-size:var(--fs-12);background:rgb(255 255 255 / .12);border:1px solid rgb(255 255 255 / .16)}
.hero-card .hc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.hero-card .btn{background:rgb(255 255 255 / .12);border-color:rgb(255 255 255 / .2);color:#fff;box-shadow:none}
.hero-card .btn:hover{background:rgb(255 255 255 / .2)}
.hero-card .btn.white{background:#fff;color:#062E22;border-color:#fff;font-weight:600}
.hero-card .btn.white:hover{background:#ECFDF5}
.hero-card .badge{background:rgb(0 0 0 / .25);border-color:rgb(255 255 255 / .2);color:#fff}
/* item card: one subject, a short summary, one action; clickable when it opens something */
.icard{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;padding:16px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--border);
  transition:border-color var(--dur-1) ease,background-color var(--dur-1) ease,transform var(--dur-2) var(--ease-out)}
.icard.in{background:var(--card-2)}
a.icard,button.icard,.icard.click{cursor:pointer;text-align:left;text-decoration:none;color:inherit}
a.icard:hover,button.icard:hover,.icard.click:hover{border-color:var(--border-3);background:var(--card-2)}
.icard.sel{border-color:var(--accent-ring);box-shadow:0 0 0 3px rgb(34 197 94 / .07)}
.icard-h{display:flex;align-items:flex-start;gap:10px;min-width:0}
.icard-t{font-size:var(--fs-14);font-weight:600;letter-spacing:-.01em;line-height:1.35;min-width:0}
.icard-m{font-size:var(--fs-12);color:var(--text-3);font-variant-numeric:tabular-nums}
.icard-x{font-size:var(--fs-13);color:var(--text-2);line-height:1.55}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min,260px),1fr));gap:12px}
/* icon box (like the reference's avatars and chips) */
.ibox{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r-md);background:var(--card-3);border:1px solid var(--border);color:var(--text-2)}
.ibox svg.ic{width:17px;height:17px}
.ibox.g{color:var(--accent-hi);background:var(--accent-soft);border-color:rgb(34 197 94 / .2)}
.ibox.c{color:var(--cyan-hi);background:var(--cyan-soft);border-color:rgb(6 182 212 / .2)}
.ibox.o{color:#FDBA74;background:var(--orange-soft);border-color:rgb(249 115 22 / .2)}
.ibox.r{color:var(--red-hi);background:var(--red-soft);border-color:rgb(239 68 68 / .2)}
.ibox.v{color:#C4B5FD;background:var(--violet-soft);border-color:rgb(139 92 246 / .2)}
/* card header with an "open" arrow (the reference's ↗) */
.card-open{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--border-2);color:var(--text-2);transition:background-color var(--dur-1) ease,color var(--dur-1) ease,border-color var(--dur-1) ease}
.card-open:hover{background:var(--card-3);color:var(--text-1);border-color:var(--border-3)}
.card-open svg.ic{width:16px;height:16px}
/* section header with "see all" */
.sec-h{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.sec-h h2,.sec-h h3{margin:0;font-size:var(--fs-16);font-weight:600;letter-spacing:-.015em}
.sec-h small{font-size:var(--fs-13);color:var(--text-3)}
.see-all,.link-btn{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-13);font-weight:500;color:var(--text-2);text-decoration:none;cursor:pointer}
.see-all{margin-left:auto}
.see-all:hover,.link-btn:hover{color:var(--accent-hi)}
.see-all svg.ic,.link-btn svg.ic{width:14px;height:14px}
.link-btn.g{color:var(--accent-hi)}
/* long text: clamped until asked for */
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,3);overflow:hidden}
.clamp.open{display:block;-webkit-line-clamp:unset;overflow:visible}
/* mini stat: a label and a value, as a small card */
.mstat{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r-md);background:var(--card-2);border:1px solid var(--border);min-width:0}
.mstat .l{font-size:var(--fs-12);color:var(--text-3);line-height:1.4}
.mstat .v{font-size:var(--fs-14);font-weight:500;color:var(--text-1);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
/* info tip: explanations live here, not in paragraphs */
.tipi{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:var(--text-3);cursor:help;vertical-align:-4px;flex:none}
.tipi svg.ic{width:15px;height:15px}
.tipi:hover,.tipi:focus-visible{color:var(--text-1)}
.tipi::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translate(-50%,-4px);width:max-content;max-width:300px;padding:9px 11px;border-radius:var(--r-md);
  background:var(--card-3);border:1px solid var(--border-2);box-shadow:var(--shadow-float);font-family:var(--font-sans);font-size:var(--fs-12);font-weight:400;line-height:1.55;color:var(--text-1);
  white-space:normal;text-align:left;letter-spacing:0;opacity:0;pointer-events:none;transition:opacity var(--dur-1) ease,transform var(--dur-1) ease;z-index:60}
.tipi:hover::after,.tipi:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.tipi.r::after{left:auto;right:-6px;transform:translate(0,-4px)}.tipi.r:hover::after,.tipi.r:focus-visible::after{transform:none}

/* popover menu: <details class="pop"><summary class="btn">…</summary><div class="pop-b">…</div></details> */
.pop{position:relative;display:inline-block}
.pop>summary{display:inline-flex;list-style:none;color:var(--text-1)}
.pop>summary::before{content:none}
.pop>summary .chev{transition:transform var(--dur-2) var(--ease-out)}
.pop[open]>summary .chev{transform:rotate(180deg)}
.pop-b{position:absolute;top:calc(100% + 8px);right:0;z-index:45;min-width:260px;max-width:min(440px,92vw);padding:6px;border-radius:var(--r-lg);
  background:var(--pop-bg,#151518);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--border-2);box-shadow:var(--shadow-float);
  transform-origin:top right;animation:t-pop var(--dur-2) var(--ease-out)}
.pop.l>.pop-b{left:0;right:auto;transform-origin:top left}
.pop.up>.pop-b{top:auto;bottom:calc(100% + 8px);transform-origin:bottom right}
.pop-sec{padding:10px 10px 6px;font-size:var(--fs-12);font-weight:500;color:var(--text-3)}
.pop-sep{height:1px;margin:6px 4px;background:var(--border)}
.pop-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 10px;font-size:var(--fs-13);color:var(--text-2)}
.pop-row>select,.pop-row>input{height:var(--h-sm);font-size:var(--fs-13)}
.pop-scroll{max-height:min(60vh,520px);overflow:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-md);text-align:left;font-size:var(--fs-13);color:var(--text-1);cursor:pointer;transition:background-color var(--dur-1) ease}
.mi:hover{background:var(--card-3)}
.mi.on{background:var(--accent-soft)}
.mi.on>svg.ic:first-child{color:var(--accent)}
.mi small{display:block;margin-top:1px;font-size:var(--fs-12);color:var(--text-3);line-height:1.4}
.mi .r{margin-left:auto;font-size:var(--fs-12);color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* side sheet: details open here, on request */
.sheet-scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--dur-3) ease;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:12px;right:12px;bottom:12px;z-index:71;width:min(680px,calc(100vw - 24px));display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r-xl);
  background:var(--glass-strong);transform:translateX(calc(100% + 24px));transition:transform var(--dur-3) var(--ease-drawer)}
.sheet.open{transform:none}
.sheet.wide{width:min(1080px,calc(100vw - 24px))}
.sheet-h{flex:none;display:flex;align-items:center;gap:12px;padding:18px 14px 16px 24px;border-bottom:1px solid var(--border)}
.sheet-k{display:flex;align-items:center;gap:6px;font-size:var(--fs-12);color:var(--text-3)}
.sheet-t{margin:2px 0 0;font-size:var(--fs-18);font-weight:600;letter-spacing:-.02em}
.sheet-b{flex:1;overflow:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:12px}

/* ---------- 6. Motion ---------- */
@keyframes t-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes t-pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes t-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes t-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}

/* ---------- 7. The sidebar as an icon rail (narrow screens, or collapsed by hand) ---------- */
/* shell.js adds .is-rail below a page's width (body data-rail, default 1400px) or when the user collapses it */
.shell.is-rail{--sb-w:68px}
.is-rail .sb-brand{justify-content:center;padding:0}
.is-rail .sb-name,.is-rail .sb-item span,.is-rail .sb-sec,.is-rail .sb-card{display:none}
.is-rail .sb-item{justify-content:center;padding:0}
.is-rail .sb-foot{display:flex;justify-content:center}
.is-rail .sb-collapse svg.ic{transform:scaleX(-1)}
.sb-collapse{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;margin-top:8px;border-radius:var(--r-md);color:var(--text-3);font-size:var(--fs-13);font-weight:500}
.sb-collapse:hover{background:var(--card-2);color:var(--text-1)}
.sb-collapse svg.ic{width:18px;height:18px}
.is-rail .sb-collapse{width:42px;justify-content:center;padding:0}
.is-rail .sb-collapse span{display:none}
/* @theme:end */

/* page: catalogue (A51: one network at a time, as cards; everything else on request) */
#theme{font-size:0}
.picker{max-width:440px;gap:10px}
.picker #pickName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-b{width:400px}
.pick-b .field-ic{margin:4px 4px 6px}
.pick-b .field-ic input{width:100%}
.view[hidden]{display:none}
.wrap{max-width:1440px;margin:0 auto}
/* grid of cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:stretch}
.grid>.card{display:flex;flex-direction:column}
.grid>.card>.card-f{margin-top:auto}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.grid>*{animation:t-rise var(--dur-3) var(--ease-out) both}
.grid>*:nth-child(2){animation-delay:30ms}.grid>*:nth-child(3){animation-delay:60ms}.grid>*:nth-child(4){animation-delay:90ms}.grid>*:nth-child(5){animation-delay:120ms}.grid>*:nth-child(6){animation-delay:150ms}
.card-h .grow{flex:1;min-width:0}
.card-h .ibox{margin-top:-2px}
.hero-card .badge{position:absolute;top:22px;right:22px}
.hero-card h2{padding-right:120px}
/* list in the picker */
.pk-g{padding:10px 10px 4px;font-size:var(--fs-12);font-weight:500;color:var(--text-3)}
.pk{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--r-md);text-align:left;font-size:var(--fs-13);color:var(--text-1);cursor:pointer}
.pk:hover{background:var(--card-3)}
.pk.sel{background:var(--accent-soft)}
.pk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .r{font-size:var(--fs-12);color:var(--text-3);font-variant-numeric:tabular-nums}
.sd{flex:none;width:8px;height:8px;border-radius:50%;background:var(--text-4)}
.sd.complete{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sd.verified{background:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
.sd.atlas{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-2)}
.sd.umap{background:var(--text-3)}
.sd.notv{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-4)}
/* findings */
.find{display:flex;flex-direction:column;gap:10px}
.fcard{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:14px;border-radius:var(--r-lg);background:var(--card-2);border:1px solid var(--border);line-height:1.6;font-size:var(--fs-14)}
.fcard .no{display:grid;place-items:center;width:26px;height:26px;border-radius:var(--r-sm);background:var(--card-4);font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-2)}
.fcard.hl{background:linear-gradient(180deg,rgb(34 197 94 / .08),rgb(34 197 94 / .02));border-color:rgb(34 197 94 / .28)}
.fcard.hl .no{background:var(--accent-soft);color:var(--accent-hi)}
.fcard .clamp{--lines:2}
.card-f{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 22px 20px}
.card-f .btn{height:32px}
/* small mechanism previews */
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-md);background:var(--card-2);border:1px solid var(--border)}
.mrow .id{font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text-1)}
.mrow .tr{font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .u{font-size:var(--fs-12);color:var(--text-3);font-variant-numeric:tabular-nums}
.mstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.chips-l{display:flex;gap:6px;flex-wrap:wrap}
.lab{display:inline-flex;align-items:center;height:22px;font-size:var(--fs-12);font-weight:500;padding:0 8px;border-radius:var(--r-sm);font-family:var(--font-sans);white-space:nowrap}
.lab.rule{color:var(--accent-hi);background:var(--accent-soft);border:1px solid rgb(34 197 94 / .22)}
.lab.lookup{color:#FDBA74;background:var(--orange-soft);border:1px solid rgb(249 115 22 / .22)}
:root[data-theme=light] .lab.lookup{color:#C2410C}
.lab.not,.lab.unchecked,.lab.trusted,.lab.always{color:var(--text-2);background:var(--card-3);border:1px solid var(--border)}
/* step through */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{padding:14px;border-radius:var(--r-lg);background:var(--card-2);border:1px solid var(--border)}
.ans .l{display:flex;align-items:center;gap:8px;font-size:var(--fs-12);color:var(--text-3)}
.ans .v{margin-top:6px;font-family:var(--font-mono);font-size:var(--fs-20);font-weight:500}
.agree{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:var(--r-md);font-weight:500;font-size:var(--fs-13)}
.agree::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.agree.y{color:var(--accent-hi);background:var(--accent-soft);border:1px solid rgb(34 197 94 / .25)}
.agree.n{color:var(--bad-hi);background:var(--bad-soft);border:1px solid rgb(239 68 68 / .25)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.steps{display:none;flex-direction:column;gap:8px;margin-top:12px}
.steps.open{display:flex}
.scard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-radius:var(--r-md);background:var(--card-2);border:1px solid var(--border);font-size:var(--fs-13)}
.scard .w{font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text-3);grid-row:span 2}
.scard .a{font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text-1)}
.scard .b{font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text-2)}
.scard b{font-family:var(--font-sans);font-weight:500;color:var(--text-3);margin-right:6px}
/* construction */
.desc{font-size:var(--fs-14);line-height:1.7;color:var(--text-1)}
.desc.clamp{--lines:4}
.facts{display:flex;gap:8px;flex-wrap:wrap}
/* sub-views */
.vbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.vbar h2{margin:0;font-size:var(--fs-20);font-weight:600;letter-spacing:-.02em}
.vbar .sub{font-size:var(--fs-14);color:var(--text-3)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .field-ic input{width:320px}
.toolbar .count{margin-left:auto;font-size:var(--fs-13);color:var(--text-3);font-variant-numeric:tabular-nums}
/* mechanisms as cards (the table keeps its rows for the tests; each row is drawn as a card) */
table.mechs,table.mechs tbody{display:block}
table.mechs thead{display:none}
table.mechs tbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
table.mechs tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"id use" "trig trig" "conf spec" "eff eff" "rw rw";gap:10px 12px;align-content:start;
  padding:16px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:border-color var(--dur-1) ease,background-color var(--dur-1) ease}
table.mechs tr:hover{border-color:var(--border-3)}
table.mechs tr.open{background:var(--card-2);border-color:var(--border-3)}
table.mechs tr.over{display:none!important}
table.mechs td{display:block;padding:0;border:0;font-size:var(--fs-13);min-width:0}
table.mechs td::before{display:block;content:attr(data-k);font-family:var(--font-sans);font-size:var(--fs-11);font-weight:500;color:var(--text-3);margin-bottom:3px}
table.mechs td.m-id{grid-area:id;font-family:var(--font-mono);font-weight:500}
table.mechs td.m-id::before,table.mechs td.m-use::before{content:none}
table.mechs td.m-use{grid-area:use;font-size:var(--fs-12);color:var(--text-3);text-align:right}
table.mechs td.m-trig{grid-area:trig;font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text-1)}
table.mechs td.m-trig .clamp{--lines:3}
table.mechs tr.open td.m-trig .clamp{display:block;-webkit-line-clamp:unset}
table.mechs td.m-conf{grid-area:conf}
table.mechs td.m-spec{grid-area:spec;text-align:right}
table.mechs td.m-eff{grid-area:eff;display:none;color:var(--text-2)}
table.mechs td.m-rw{grid-area:rw;display:none;font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text-2);overflow-wrap:anywhere}
table.mechs tr.open td.m-eff,table.mechs tr.open td.m-rw{display:block}
table.mechs tr.always{opacity:.85}
.more-row{display:flex;justify-content:center;margin-top:16px}
/* playground */
.vals{position:relative;display:flex;gap:3px;align-items:flex-end;height:110px;padding:10px 10px 0;margin-top:12px;border-radius:var(--r-md);background:var(--sunk);border:1px solid var(--border);
  background-image:repeating-linear-gradient(to top,transparent 0,transparent 26px,rgb(255 255 255 / .05) 26px,rgb(255 255 255 / .05) 27px)}

.vals span{flex:1;min-width:3px;border-radius:3px 3px 0 0;background:var(--c,var(--cyan));opacity:.45}
.vals span.top{opacity:1;box-shadow:0 0 12px -2px var(--c,var(--cyan))}
.vals-d{margin-top:8px;font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text-3)}

.vcard .s{font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text-3)}

.filters{display:flex;flex-direction:column;gap:2px}

/* ic('name') -> an inline <svg> string, for templates */
function ic(name, cls = '') {
  const p = ICONS[name]; if (!p) return '';
  return `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}
/* <i data-icon="name"></i> in static markup becomes the svg */
function hydrateIcons(root = document) {
  root.querySelectorAll('i[data-icon]').forEach(el => { if (!el.firstChild) el.outerHTML = ic(el.dataset.icon, el.className); });
}
hydrateIcons();
/* the sidebar becomes an icon rail below the page's width (body data-rail), or when collapsed by hand (remembered) */
(() => {
  const shell = document.querySelector('.shell'); if (!shell) return;
  const mq = matchMedia(`(max-width:${document.body.dataset.rail || 1400}px)`);
  const key = 'gn-rail', pref = () => { try { return localStorage.getItem(key); } catch (e) { return null; } };
  const upd = () => shell.classList.toggle('is-rail', pref() === 'on' || (pref() !== 'off' && mq.matches));
  mq.addEventListener('change', upd); upd();
  const b = document.getElementById('sbCollapse');
  if (b) b.onclick = () => { const on = !shell.classList.contains('is-rail'); try { localStorage.setItem(key, on ? 'on' : 'off'); } catch (e) {} upd(); };
})();
/* ---------- side sheet: details open here, on request ---------- */

  document.getElementById('sheetK').innerHTML = kicker;

  s.classList.toggle('wide', !!wide); s.classList.add('open'); s.setAttribute('aria-hidden', 'false');

function closeSheet() {

}

/* ---------- popover menus: one open at a time, closed by a click outside or Esc ---------- */
function closePops(except) { document.querySelectorAll('details.pop[open]').forEach(d => { if (d !== except) d.removeAttribute('open'); }); }
document.addEventListener('click', e => closePops(e.target.closest('details.pop')));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePops(); closeSheet(); } });
/* ---------- "read more": <div class="clamp" id="x">…</div><button class="link-btn" data-more="x">Read more</button> ---------- */
document.addEventListener('click', e => {

  const t = document.getElementById(b.dataset.more) || b.previousElementSibling; if (!t) return;
  b.dataset.label = b.dataset.label || b.textContent;
  t.classList.toggle('open'); b.textContent = t.classList.contains('open') ? (b.dataset.less || 'Show less') : b.dataset.label;
});
/* hide "read more" where the text already fits */
function fitMore(root = document) {

    const t = document.getElementById(b.dataset.more) || b.previousElementSibling;

/* ---------- the network picker (a menu, not a permanent list) ---------- */
function renderList() {
  const q = $("#q").value.trim().toLowerCase();
  const keep = E.map((e, i) => [e, i]).filter(([e]) => !q || (e.name + " " + e.target + " " + e.task + " " + e.family).toLowerCase().includes(q));
  $("#nShown").textContent = E.length;
  const groups = {};
  keep.forEach(([e, i]) => (groups[e.family || "Other"] ||= []).push([e, i]));
  $("#list").innerHTML = Object.entries(groups).map(([g, items]) => `<div class="pk-g">${esc(g)}</div>` +
    items.map(([e, i]) => `<button class="pk${cur === e ? " sel" : ""}" data-i="${i}" title="${esc(e.name)} · ${esc(e.status)}"><span class="sd ${stCls(e.status)}"></span><span class="nm">${esc(e.name)}</span><span class="r">${e.params?.toLocaleString() ?? ""}</span></button>`).join("")).join("")
    || '<div class="empty">No networks match.</div>';
  $$("#list .pk").forEach(b => b.onclick = () => { closePops(); show(+b.dataset.i); });
}

/* ---------- every network as a card (on request) ---------- */
const FILTERS = [["all", "All networks"], ["atlas", "Has an atlas"], ["certified", "Certified"]];
function browse() {
  $("#detail").hidden = true; $("#browse").hidden = false; history.replaceState(null, "", "?view=all"); closePops();
  const q = ($("#bq") || {}).value || "";
  $("#browse").innerHTML = `<div class="vbar"><h2>All networks</h2><span class="sub" id="bcount"></span><span class="spacer"></span>
      <label class="field-ic">${ic("search")}<input id="bq" placeholder="Search…" value="${esc(q)}" style="width:260px"></label>
      <details class="pop"><summary class="btn sm">${ic("list-filter")}<span id="fName">${FILTERS.find(f => f[0] === filt)[1]}</span>${ic("chevron-down", "chev")}</summary>
        <div class="pop-b" style="min-width:220px"><div class="pop-sec">Show</div><div class="filters">${FILTERS.map(([k, l]) => `<button class="mi${filt === k ? " on" : ""}" data-f="${k}">${ic(filt === k ? "check" : "circle-dot")}${l}</button>`).join("")}</div></div></details>
      ${cur ? `<button class="btn sm" id="backDetail">${ic("chevron-right")}Back to ${esc(cur.name.length > 28 ? cur.name.slice(0, 28) + "…" : cur.name)}</button>` : ""}</div>

  $("#bq").oninput = drawBrowse;

function drawBrowse() {
  const q = $("#bq").value.trim().toLowerCase();
  const keep = E.map((e, i) => [e, i]).filter(([e]) => (!q || (e.name + " " + e.target + " " + e.task + " " + e.family).toLowerCase().includes(q)) &&
    (filt === "all" || (filt === "atlas" && e.atlas) || (filt === "certified" && (e.status === "complete" || e.status === "verified"))));
  $("#bcount").textContent = `${keep.length} of ${E.length}`;
  const groups = {};
  keep.forEach(([e, i]) => (groups[e.family || "Other"] ||= []).push([e, i]));
  $("#bgrid").innerHTML = Object.entries(groups).map(([g, items]) => `<section class="fam${shut.has(g) ? " shut" : ""}" data-g="${esc(g)}">

  $$("#bgrid .ncard").forEach(c => c.onclick = () => show(+c.dataset.i));
  $$("#bgrid [data-tog]").forEach(b => b.onclick = () => { const s = b.closest(".fam"), g = s.dataset.g; shut.has(g) ? shut.delete(g) : shut.add(g); s.classList.toggle("shut"); b.firstChild.textContent = shut.has(g) ? "Show" : "Hide"; });

async function load() {
  E = await (await fetch("/api/catalog")).json();
  const nA = E.filter(e => e.atlas).length, nC = E.filter(e => e.status === "complete" || e.status === "verified").length;
  const nD = E.filter(e => e.decomp?.report?.verdict?.startsWith("PASS")).length;
  $("#ctxT").textContent = `${E.length} networks · ${nA} atlases · ${nC} certified · ${nD} decompiled`;
  renderList(); $("#q").oninput = renderList;
  $("#browseBtn").onclick = browse; $("#browseMi").onclick = browse;
  const p = new URLSearchParams(location.search), i = E.findIndex(e => e.target === p.get("t"));
  if (p.get("view") === "all") { cur = null; browse(); return; }

function atlasStats(a) {
