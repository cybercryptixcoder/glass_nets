/* @theme:begin (generated by sync_theme.py; do not edit here) */
/* ==========================================================================
   Glass Networks theme, v3 (Nov 20, 2026, A51: cards and progressive disclosure; v2 was A50). The single source of truth for how the lab looks.
   References: Linear (density, zinc neutrals, hairlines), Raycast (lit edges, floating glass),
   Vercel Geist (type, materials), and Shreyas's SalesOps dashboard reference (app shell, KPI cards, accents).
   Rules: docs/design/THEME.md.  Research: docs/design/UI_RESEARCH.md.

   Inlined into each page by:   python3 lab/static/sync_theme.py   (never edit the copies)
   Fonts each page loads:       Geist (300..700), Geist Mono (400..600) from Google Fonts
   ========================================================================== */

/* ---------- 1. Tokens (dark is the design; light is supported) ---------- */
:root{
  color-scheme:dark;
  --font-sans:"Geist","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* surfaces: zinc near-black; far is darker, near is lighter */
  --bg:#09090B;            /* page, sidebar, header */
  --card:#111114;          /* cards */
  --card-2:#17171B;        /* inputs, icon boxes, hover, cards inside cards */
  --card-3:#1D1D22;        /* selected, tracks */
  --card-4:#26262C;        /* raised thumb, hover on selected */
  --sunk:#0B0B0D;          /* code, logs, wells */
  --glass:rgb(17 17 19 / .72);
  --glass-strong:rgb(15 15 17 / .9);
  --scrim:rgb(0 0 0 / .6);

  /* hairlines */
  --border:rgb(255 255 255 / .075);
  --border-2:rgb(255 255 255 / .11);
  --border-3:rgb(255 255 255 / .18);
  --edge:rgb(255 255 255 / .04);       /* inner top light on cards */

  /* text */
  --text-1:#F4F4F5; --text-2:#A1A1AA; --text-3:#71717A; --text-4:#52525B;

  /* accents: green leads (actions, selection, good), cyan second (data, info) */
  --accent:#22C55E; --accent-hi:#4ADE80; --on-accent:#04140A;
  --accent-soft:rgb(34 197 94 / .1); --accent-ring:rgb(34 197 94 / .6);
  --cyan:#06B6D4; --cyan-hi:#22D3EE; --cyan-soft:rgb(6 182 212 / .12);
  --orange:#F97316; --orange-soft:rgb(249 115 22 / .12);
  --amber:#F59E0B; --amber-soft:rgb(245 158 11 / .12);
  --red:#EF4444; --red-hi:#F87171; --red-soft:rgb(239 68 68 / .12);
  --violet:#8B5CF6; --violet-soft:rgb(139 92 246 / .12);
  --brand-grad:linear-gradient(135deg,#22C55E 0%,#06B6D4 100%);
  /* status (meaning) */
  --ok:var(--accent); --ok-hi:var(--accent-hi); --ok-soft:var(--accent-soft);
  --warn:var(--amber); --warn-soft:var(--amber-soft);
  --bad:var(--red); --bad-hi:var(--red-hi); --bad-soft:var(--red-soft);
  --info:var(--cyan); --info-soft:var(--cyan-soft);

  /* data: diverging orange <-> cyan, neutral midpoint (validated: CVD dE 21, both in the dark band). Hex: canvas reads these. */
  --div-neg:#E8601C; --div-pos:#0E9FBF; --div-mid:#18181B;

  /* type scale */
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px; --fs-18:18px; --fs-20:20px; --fs-24:24px; --fs-32:32px;

  /* shape */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:999px;
  --h-sm:30px; --h-md:36px;
  --sb-w:248px; --hdr-h:64px;

  /* depth */
  --shadow-card:inset 0 1px 0 var(--edge), 0 1px 2px rgb(0 0 0 / .4);
  --shadow-float:0 0 0 .5px rgb(0 0 0 / .9), 0 8px 16px -4px rgb(0 0 0 / .5), 0 24px 56px -8px rgb(0 0 0 / .7), inset 0 1px 0 rgb(255 255 255 / .06);
  --blur:blur(24px) saturate(1.6);
  --focus:0 0 0 2px var(--bg), 0 0 0 4px var(--accent-ring);

  /* motion */
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --dur-1:120ms; --dur-2:180ms; --dur-3:280ms;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#FAFAFA; --card:#FFFFFF; --card-2:#F4F4F5; --card-3:#EDEDEF; --card-4:#FFFFFF; --sunk:#F7F7F8;
  --glass:rgb(255 255 255 / .75); --glass-strong:rgb(255 255 255 / .92); --scrim:rgb(9 9 11 / .3);
  --pop-bg:rgb(255 255 255 / .98);
  --border:rgb(0 0 0 / .08); --border-2:rgb(0 0 0 / .12); --border-3:rgb(0 0 0 / .2); --edge:rgb(255 255 255 / .8);
  --text-1:#09090B; --text-2:#52525B; --text-3:#71717A; --text-4:#A1A1AA;
  --accent:#16A34A; --accent-hi:#15803D; --on-accent:#FFFFFF; --accent-soft:rgb(22 163 74 / .1); --accent-ring:rgb(22 163 74 / .55);
  --cyan:#0891B2; --cyan-hi:#0E7490; --red-hi:#DC2626;
  --div-mid:#F4F4F5;
  --shadow-card:0 1px 2px rgb(0 0 0 / .05);
  --shadow-float:0 0 0 .5px rgb(0 0 0 / .12), 0 8px 16px -4px rgb(0 0 0 / .08), 0 24px 56px -8px rgb(0 0 0 / .16);
}

/* ---------- 2. Base ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text-1);font-family:var(--font-sans);font-size:var(--fs-14);line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{text-wrap:balance}
p,li{text-wrap:pretty}
::selection{background:rgb(34 197 94 / .28);color:var(--text-1)}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:var(--focus)}
::placeholder{color:var(--text-3);opacity:1}
*{scrollbar-width:thin;scrollbar-color:var(--card-4) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--card-4);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--border-3);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
.mono,code,kbd,pre{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}
.spacer{flex:1}
.muted{color:var(--text-2)} .faint{color:var(--text-3)} .small{font-size:var(--fs-12)}
svg.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
svg.ic.flip{transform:scaleX(-1)}

/* ---------- 3. App shell: sidebar + header + content ---------- */
.shell{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);height:100vh}
.sb{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--bg)}
.sb-brand{flex:none;display:flex;align-items:center;gap:12px;height:var(--hdr-h);padding:0 18px;border-bottom:1px solid var(--border);text-decoration:none}
.sb-logo{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-md);background:#FAFAFA;color:#09090B;
  box-shadow:0 0 0 1px rgb(255 255 255 / .1),0 1px 2px rgb(0 0 0 / .5),inset 0 -1px 0 rgb(0 0 0 / .12)}
:root[data-theme=light] .sb-logo{background:#09090B;color:#FAFAFA}
.sb-logo svg.ic{width:18px;height:18px;stroke-width:2}
.sb-name{font-size:var(--fs-16);font-weight:600;letter-spacing:-.015em;white-space:nowrap}
.sb-nav{display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow:auto}
.sb-sec{padding:4px 12px 8px;font-size:var(--fs-12);font-weight:500;color:var(--text-4)}
.sb-item{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:var(--r-md);text-decoration:none;
  color:var(--text-2);font-size:var(--fs-14);font-weight:500;white-space:nowrap;
  transition:background-color var(--dur-1) ease,color var(--dur-1) ease,box-shadow var(--dur-1) ease}
.sb-item svg.ic{width:18px;height:18px}
.sb-item:hover{background:var(--card-2);color:var(--text-1)}
body[data-page=catalog] .sb-item[data-nav=catalog],body[data-page=lab] .sb-item[data-nav=lab],body[data-page=constructor] .sb-item[data-nav=constructor]{
  color:var(--text-1);background:linear-gradient(180deg,rgb(34 197 94 / .07),rgb(34 197 94 / .03));
  box-shadow:inset 0 0 0 1.5px var(--accent-ring),0 0 0 3px rgb(34 197 94 / .06),0 0 18px -4px rgb(34 197 94 / .35)}
body[data-page=catalog] .sb-item[data-nav=catalog] svg,body[data-page=lab] .sb-item[data-nav=lab] svg,body[data-page=constructor] .sb-item[data-nav=constructor] svg{color:var(--accent)}
.sb-foot{margin-top:auto;padding:12px}
.sb-card{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--border)}
.sb-card-ic{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-md);background:var(--brand-grad);color:#04140A}
.sb-card b{display:block;font-size:var(--fs-13);font-weight:600}
.sb-card small{display:block;font-size:var(--fs-12);color:var(--text-3);line-height:1.4;margin-top:1px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.hdr{flex:none;display:flex;align-items:center;gap:20px;height:var(--hdr-h);padding:0 24px;border-bottom:1px solid var(--border);
  background:rgb(9 9 11 / .8);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);position:relative;z-index:5}
:root[data-theme=light] .hdr{background:rgb(250 250 250 / .8)}
.hdr-title{margin:0;font-size:var(--fs-20);font-weight:600;letter-spacing:-.025em;white-space:nowrap}
.hdr-ctx{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:var(--fs-14);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-ctx svg.ic{color:var(--text-3)}
.hdr-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.content{flex:1;min-height:0;overflow:auto;padding:24px}

/* search field with an icon */
.field-ic{position:relative;display:flex;align-items:center}
.field-ic>svg.ic{position:absolute;left:12px;color:var(--text-3);pointer-events:none}
.field-ic>input{padding-left:36px!important}

/* icon button (square) */
.icon-btn{display:inline-grid;place-items:center;width:var(--h-md);height:var(--h-md);border-radius:var(--r-md);color:var(--text-2);
  transition:background-color var(--dur-1) ease,color var(--dur-1) ease}
.icon-btn:hover{background:var(--card-2);color:var(--text-1)}
.icon-btn svg.ic{width:18px;height:18px}

/* ---------- 4. Cards ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-card)}
.card-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 0}
.card-t{margin:0;font-size:var(--fs-16);font-weight:600;letter-spacing:-.015em;color:var(--text-1)}
.card-s{margin:2px 0 0;font-size:var(--fs-13);color:var(--text-2)}
.card-b{padding:18px 22px 22px}
.card-x{margin-left:auto;display:flex;align-items:center;gap:8px}

/* progress rows ("pipeline stages") */
.prog{display:flex;flex-direction:column;gap:18px}
.prog-row{display:flex;flex-direction:column;gap:9px}
.prog-h{display:flex;align-items:baseline;gap:10px;font-size:var(--fs-14)}
.prog-h .l{flex:1;color:var(--text-1);min-width:0}
.prog-h .n{margin-left:auto;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog-h .p{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:6px;border-radius:var(--r-full);background:var(--card-3);overflow:hidden}
.track>i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent));transition:width var(--dur-3) var(--ease-out)}

/* ---------- 5. Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h-md);padding:0 14px;border-radius:var(--r-md);
  font-size:var(--fs-14);font-weight:500;line-height:1;white-space:nowrap;text-decoration:none;color:var(--text-1);
  background:var(--card-2);border:1px solid var(--border-2);box-shadow:inset 0 1px 0 var(--edge);cursor:pointer;user-select:none;
  transition:background-color var(--dur-1) ease,border-color var(--dur-1) ease,color var(--dur-1) ease,transform var(--dur-1) var(--ease-out)}
.btn:hover{background:var(--card-3);border-color:var(--border-3)}
.btn:active{transform:scale(.97)}
.btn svg.ic{width:16px;height:16px}
.btn.sm{height:var(--h-sm);padding:0 12px;font-size:var(--fs-13)}
/* primary: one per view. Legacy names .orange/.primary map here */
.btn.primary,.btn.orange{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600;box-shadow:0 0 0 1px rgb(34 197 94 / .4),0 6px 20px -8px rgb(34 197 94 / .55),inset 0 1px 0 rgb(255 255 255 / .25)}
.btn.primary:hover,.btn.orange:hover{background:var(--accent-hi)}
.btn.yellow{border-color:rgb(34 197 94 / .35);color:var(--accent-hi);background:var(--accent-soft)}
.btn.yellow:hover{border-color:var(--accent-ring);background:rgb(34 197 94 / .16)}
.btn.teal{}
.btn.warm{background:transparent}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--card-2);color:var(--text-1)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-ring);color:var(--text-1)}
.btn:disabled,.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary:disabled,.btn.orange:disabled{background:var(--card-3);color:var(--text-2);box-shadow:none}

/* chips: filters and toggles; selected = the sidebar's green outline */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-full);font-size:var(--fs-13);font-weight:500;
  color:var(--text-2);background:transparent;border:1px solid var(--border-2);cursor:pointer;user-select:none;white-space:nowrap;
  transition:background-color var(--dur-1) ease,color var(--dur-1) ease,border-color var(--dur-1) ease}
.chip:hover{color:var(--text-1);background:var(--card-2)}
.chip.on{color:var(--text-1);background:var(--accent-soft);border-color:var(--accent-ring)}

/* pill: passive label */
.pill{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:var(--r-md);font-size:var(--fs-13);font-weight:500;color:var(--text-2);background:var(--card-2);border:1px solid var(--border);white-space:nowrap}
.pill svg.ic{color:var(--text-3)}

/* badge: status */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-sm);font-size:var(--fs-12);font-weight:500;white-space:nowrap;
  color:var(--text-2);background:var(--card-3);border:1px solid var(--border)}
.badge.ok{color:var(--ok-hi);background:var(--ok-soft);border-color:rgb(34 197 94 / .22)}
.badge.warn,.badge.part{color:#FBBF24;background:var(--warn-soft);border-color:rgb(245 158 11 / .22)}
.badge.bad,.badge.no{color:var(--bad-hi);background:var(--bad-soft);border-color:rgb(239 68 68 / .22)}
.badge.info,.badge.run{color:var(--cyan-hi);background:var(--info-soft);border-color:rgb(6 182 212 / .22)}
:root[data-theme=light] .badge.warn,:root[data-theme=light] .badge.part{color:#B45309}
.dot{display:inline-block;flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}

/* segmented control */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-md);background:var(--card-2);border:1px solid var(--border)}
.seg button{height:26px;padding:0 12px;border-radius:var(--r-sm);font-size:var(--fs-13);font-weight:500;color:var(--text-2);transition:background-color var(--dur-1) ease,color var(--dur-1) ease}
.seg button:hover{color:var(--text-1)}
.seg button.on{color:var(--text-1);background:var(--card-4);box-shadow:inset 0 0 0 1px var(--border-2),inset 0 1px 0 rgb(255 255 255 / .05),0 1px 2px rgb(0 0 0 / .4)}
:root[data-theme=light] .seg button.on{background:#fff;box-shadow:0 0 0 .5px rgb(0 0 0 / .12),0 1px 2px rgb(0 0 0 / .08)}

/* underline tabs (Vercel) */
.utabs{display:flex;gap:24px;border-bottom:1px solid var(--border)}
.utabs button{position:relative;height:44px;font-size:var(--fs-14);font-weight:500;color:var(--text-2);transition:color var(--dur-1) ease}
.utabs button:hover{color:var(--text-1)}
.utabs button.on{color:var(--text-1)}
.utabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}

/* switch: label.toggle > input[type=checkbox] + i */
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-13);color:var(--text-2);cursor:pointer;user-select:none}
.toggle:hover{color:var(--text-1)}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle i{position:relative;flex:none;width:32px;height:18px;border-radius:var(--r-full);background:var(--card-4);box-shadow:inset 0 0 0 1px var(--border-2);transition:background-color var(--dur-2) ease}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#D4D4D8;box-shadow:0 1px 2px rgb(0 0 0 / .5);transition:transform var(--dur-2) var(--ease-out),background-color var(--dur-2) ease}
.toggle input:checked+i{background:var(--accent);box-shadow:none}
.toggle input:checked+i::after{transform:translateX(14px);background:#fff}
.toggle input:focus-visible+i{box-shadow:var(--focus)}

/* fields */
input[type=text],input[type=number],input[type=search],input:not([type]),select,textarea{
  height:var(--h-md);padding:0 12px;border-radius:var(--r-md);border:1px solid var(--border-2);background:var(--card-2);color:var(--text-1);
  font-size:var(--fs-14);transition:border-color var(--dur-1) ease,box-shadow var(--dur-1) ease}
input[type=text]:hover,input[type=number]:hover,input:not([type]):hover,select:hover,textarea:hover{border-color:var(--border-3)}
input[type=text]:focus,input[type=number]:focus,input:not([type]):focus,select:focus,textarea:focus{border-color:var(--accent-ring);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
input[type=number]{font-variant-numeric:tabular-nums}
select{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2371717A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
select option,select optgroup{background:var(--card-2);color:var(--text-1)}
textarea{height:auto;padding:12px 14px;line-height:1.6;resize:vertical}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:16px;height:16px;margin:0;border-radius:var(--r-xs);background:var(--card-2);
  border:1px solid var(--border-3);cursor:pointer;display:inline-grid;place-content:center;transition:background-color var(--dur-1) ease,border-color var(--dur-1) ease}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";width:8px;height:4px;margin-top:-2px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg)}

/* disclosure */
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text-2);font-weight:500;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";flex:none;width:6px;height:6px;margin:0 3px 0 1px;border-right:1.75px solid currentColor;border-bottom:1.75px solid currentColor;transform:rotate(-45deg);transition:transform var(--dur-2) var(--ease-out)}
details[open]>summary::before{transform:rotate(45deg)}
details>summary:hover{color:var(--text-1)}

/* code */

function head(icon, title, sub, extra = "") {

/* ---- a small line chart (thin lines, recessive grid, legend) ---- */
function lineChart({series, x, yMin = 0, yMax = 1, h = 190, yFmt = v => v.toFixed(1), shade = null, xTitle = "", W = 560}) {
  const L = 36, R = 12, Tm = 10, B = xTitle ? 34 : 22, H = h;
  const xs = i => L + (W - L - R) * (x.length === 1 ? 0.5 : i / (x.length - 1));
  const ys = v => Tm + (H - Tm - B) * (1 - (Math.max(yMin, Math.min(yMax, v)) - yMin) / (yMax - yMin));
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = yMin + (yMax - yMin) * k / 4; g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end">${yFmt(v)}</text>`; }
  x.forEach((t, i) => { g += `<text x="${xs(i)}" y="${H - (xTitle ? 18 : 6)}" text-anchor="middle">${t}</text>`; });
  if (xTitle) g += `<text x="${(L + W - R) / 2}" y="${H - 3}" text-anchor="middle">${xTitle}</text>`;
  if (shade) g = `<rect x="${xs(shade[0])}" y="${Tm}" width="${xs(shade[1]) - xs(shade[0])}" height="${H - Tm - B}" fill="var(--card-3)" opacity=".7"/>` + g;
  const lines = series.map(s => { const pts = s.values.map((v, i) => v == null ? null : [xs(i), ys(v)]).filter(Boolean);
    return `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""} points="${pts.map(p => p.join(",")).join(" ")}"/>` +
      pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${s.color}" stroke="var(--card)" stroke-width="1.5"><title>${esc(s.name)}</title></circle>`).join(""); }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${lines}</svg><div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}

/* ---- a chess board from FEN, drawn from the side to move ---- */
const GLYPH = {k: "♚\uFE0E", q: "♛\uFE0E", r: "♜\uFE0E", b: "♝\uFE0E", n: "♞\uFE0E", p: "♟\uFE0E"};
function board(fen) {
  const [pos, turn] = fen.split(" "); const rows = pos.split("/"); let cells = [];
  rows.forEach((r, ri) => { let fi = 0; for (const ch of r) { if (/\d/.test(ch)) { for (let k = 0; k < +ch; k++) cells.push([ri, fi++, null]); } else cells.push([ri, fi++, ch]); } });
  if (turn === "b") cells = cells.reverse();
  return `<div class="board">${cells.map(([ri, fi, p]) => `<div class="${(ri + fi) % 2 ? "d" : "l"}">${p ? `<span class="${p === p.toUpperCase() ? "w" : "b"}">${GLYPH[p.toLowerCase()]}</span>` : ""}</div>`).join("")}</div>`;
}

/* ================= FLUID ================= */
const TERM_TEX = {adv: "\\mathbf u\\cdot\\nabla\\omega", lap_omega: "\\nabla^2\\omega", omega: "\\omega", "sin(4y)": "\\sin 4y", v: "v"};
const TERM_NAME = {adv: "Advection", lap_omega: "Viscosity", omega: "Drag", "sin(4y)": "Forcing", v: "β effect"};
function lawTex(c, order) {
  const parts = order.filter(k => k in c).map((k, i) => { const v = c[k]; const s = v < 0 ? "-" : (i ? "+" : "");
    const mag = Math.abs(v); const num = k === "adv" && Math.abs(mag - 1) < 5e-4 ? "" : (mag < 0.1 ? mag.toFixed(4) : mag.toFixed(3));
    return `${s}${num}\\,${TERM_TEX[k]}`; });
  return "\\begin{aligned}\\partial_t\\omega &= " + parts.slice(0, 2).join(" ") + "\\\\ &\\quad " + parts.slice(2).join(" ") + "\\end{aligned}";
}
function fluid() {

  const bs = F.biot_savart || {}; const dist = bs.trained ? Object.keys(bs.trained.learned_over_exact_by_distance) : [];
  const sc = F.scale || {}; const ks = Object.keys(sc).sort((a, b) => a - b);
  const at = F.atlas || {};
  return `
  <div class="hero-card k-fluid s7"><span class="badge ok"><span class="dot"></span>K1 · blind verdict PASS</span>
    <div class="k">${ic("waypoints")}Video model of a 2D flow · sees vorticity frames</div>

    <div class="hc-tags"><span class="hc-tag">${ic("sigma")}5 of 38 terms, no distractor</span><span class="hc-tag">fit R² ${f(F.law_r2, 2)}</span><span class="hc-tag">next-frame error ${pc(F.one_step_err)}</span></div>
    <div class="hc-actions"><button class="btn sm white" data-sheet="fluidTests">${ic("shield-check")}How it was tested</button><button class="btn sm" data-sheet="fluidRegimes">${ic("layers")}Law by regime</button></div></div>
  <div class="card s5">${head("sigma", "The law the model learned", "Read from the model in the forced-equilibrium regime")}
    <div class="card-b"><div class="eq">${tex(lawTex(eq, order))}</div>
    <div class="cmp" style="margin-top:10px"><span class="h">Term</span><span class="h" style="text-align:right">Model</span><span class="h" style="text-align:right">Truth</span><span class="h">Gap</span>${cmp}</div></div>
    <div class="card-f"><button class="link-btn" data-sheet="fluidPooled">Pooled fit and out of distribution</button></div></div>
  <div class="card s6">${head("atom", "Velocity: a learned Biot–Savart law", "How the model's internal velocity answers a vortex placed at a distance")}
    <div class="card-b">${dist.length ? lineChart({x: dist, xTitle: "distance of the vortex (pixels)", yMin: 0.4, yMax: 1.4, yFmt: v => v.toFixed(1),
      series: [{name: "Trained model", color: "var(--accent)", values: dist.map(k => bs.trained.learned_over_exact_by_distance[k])},
               {name: "Untrained copy", color: "var(--text-3)", values: dist.map(k => bs.control.learned_over_exact_by_distance[k])}]}) : ""}
    <p class="note" style="margin-top:8px">Response strength relative to exact physics (1.0 = exact). Far-field match: <b>${f(bs.trained?.["corr_far_r>=9"], 2)}</b> trained vs ${f(bs.control?.["corr_far_r>=9"], 2)} untrained.</p></div>

    <div class="card-b">${at.adv ? lineChart({x: at.adv.trained.map((_, i) => i === 0 ? "stem" : "b" + i), yMin: 0, yMax: 1, yFmt: v => v.toFixed(1),

}

      ${transferBadge(r)}</div>`).join("")}</div>
    <div class="legend" style="margin-top:10px"><span><i style="background:var(--accent)"></i>Leela t1</span><span><i style="background:var(--text-3)"></i>Humans (Lichess)</span></div>
    <p class="note" style="margin-top:8px"><b>Played out</b> from 146 lost positions against t1, the queen trade lifts the lost side's score from ${f(T.playout?.["strong opponent (t1 greedy) | judge LD2"]?.score_B_best_other, 2)} to ${f(T.playout?.["strong opponent (t1 greedy) | judge LD2"]?.score_A_queen_trade, 2)} (two independent judges agree), the opposite of the textbook's "when behind, avoid trades". Against a fallible opponent it adds nothing. Right column, real games (40,000 positions from games never used before): what playing the network's move <i>of this type</i> adds for humans beyond its other moves in the same situations (100 pts = a full point). The network's moves help humans by about 8 points whatever they are; the rules add nothing that holds up.</p></div>
    <div class="card-f"><button class="link-btn" data-sheet="strongHow">How each rule was tested</button><button class="link-btn" data-sheet="strongEx">Teaching positions</button></div></div>`;
}
function behaviourCard(C) {
  const B = C.behaviour.features, rp = C.rook_pawn_context || {};
  const rows = [["Rook-pawn push (a- or h-pawn)", "rook-pawn push (a,h)"], ["Quiet move", "quiet move"], ["Capture", "capture"], ["Pawn move", "pawn move"]];
  const mx = Math.max(...rows.map(([, k]) => Math.max(B[k].leela, B[k].human)));
  const ownKing = rp["in front of own castled king"];
  return `<div class="card s6">${head("activity", "What it plays differently from humans", `Same ${C.behaviour.n.toLocaleString()} game positions: Leela's choice vs the human's move`)}
    <div class="card-b split">${rows.map(([l, k]) => `<div class="bar-row"><div class="top"><span>${l}</span><b>${(100 * B[k].leela).toFixed(1)}% vs ${(100 * B[k].human).toFixed(1)}%</b></div>
      <div class="bar2" style="flex-direction:column;height:auto;gap:3px;background:none"><span style="height:6px;border-radius:4px;width:${100 * B[k].leela / mx}%;background:var(--accent)"></span><span style="height:6px;border-radius:4px;width:${100 * B[k].human / mx}%;background:var(--text-3)"></span></div></div>`).join("")}
    <div class="legend"><span><i style="background:var(--accent)"></i>Leela LD2</span><span><i style="background:var(--text-3)"></i>Human (Lichess)</span></div>
    ${ownKing ? `<p class="note">Leela pushes the rook pawn <b>in front of its own castled king ${(ownKing.leela_count / ownKing.human_count).toFixed(1)}× as often</b> as humans (${ownKing.leela_count} vs ${ownKing.human_count}), against the human rule of keeping that shelter. The rook-pawn tendency holds in every rating band and on the second network: the famous engine idea, recovered without being told.</p>` : ""}</div></div>`;
}
function channelCard(C) {
  const ch = C.channels, k = Object.keys(ch);
  return `<div class="card s6">${head("brain-circuit", "The units that carry the extra knowledge", "Quiet positions: reset one channel and watch the evaluation")}
    <div class="card-b split">${k.map(c => `<div class="bar-row"><div class="top"><span>Channel ${c}</span><b>${pc(Math.max(0, ch[c].ablation_share_of_residual_removed))} of the gap undone</b></div><div class="bar2"><span style="width:${100 * Math.max(0, ch[c].ablation_share_of_residual_removed)}%;background:var(--violet)"></span></div></div>`).join("")}
    <p class="note">Resetting channel 22 moves Leela's evaluation toward the classical one, undoing about a third of their disagreement in quiet positions. It responds to the opponent's pieces regardless of their value; simple piece counts do not explain it (they restate the library).</p></div></div>`;
}
function candRow(c, compact) {
  const crit = c.criteria ? Object.entries(c.criteria).map(([k, v]) => `<span class="badge ${v ? "ok" : "no"}">${esc(k.replace(/^\d_/, "").replace(/_/g, " "))}</span>`).join("") : "";
  return `<div class="cand"><div class="t"><span class="nm">${esc(c.name)}</span><span class="badge ${c.accepted ? "ok" : "no"}">${c.accepted ? "accepted" : c.error ? "failed to run" : "not accepted"}</span></div>
    ${c.idea ? `<div class="note${compact ? " clamp" : ""}" ${compact ? 'style="--lines:2"' : ""}>${esc(c.idea)}</div>` : ""}
    ${c.gain != null ? `<div class="note">gain ${c.gain >= 0 ? "+" : ""}${f(c.gain, 4)} [${f(c.ci?.[0], 4)}, ${f(c.ci?.[1], 4)}] · second network ${c.gain2 >= 0 ? "+" : ""}${f(c.gain2, 4)}${c.dec ? ` · decodable ${f(c.dec[0], 2)} vs ${f(c.dec[1], 2)}` : ""}</div>` : ""}
    ${crit ? `<div class="crit">${crit}</div>` : ""}${!compact && c.code ? `<details><summary class="link-btn">Code</summary><pre class="code">${esc(c.code)}</pre></details>` : ""}</div>`;
}

/* ================= sheets ================= */
const SHEETS = {
  how: () => ({kicker: "Method", title: "How Kepler decides", html: `<div class="steps">${[
    ["Pre-register", "Every pass line is written into the change ledger before the model or candidate it judges exists. Nothing is tuned on the result."],
    ["Prove the measure", "Each measurement first runs on known answers (cases that must pass and cases that must fail) before touching a real model."],
    ["Fidelity", "A statement must predict the model on inputs not used to make it."],
    ["Cause", "Changing the model along the statement must change its behaviour the way the statement says (interventions, untrained controls)."],
    ["Level", "Laws with coefficients, rules as programs, concepts with example positions. Never a list of neurons."],
    ["Novelty, measured", "How much a known-concept library already explains is subtracted first. New means a measured residual, checked against prior work."],
    ["Faithfulness", "If a model memorizes or only works in one regime, Kepler says so."]].map(([t, d], i) => `<div class="step"><span class="no">${i + 1}</span><div><b>${t}</b><p>${d}</p></div></div>`).join("")}</div>`}),
  fluidTests: () => { const F = S.fluid; return {kicker: "K1", title: "How the fluid law was tested", html: `<div class="steps">
    <div class="step"><span class="no">a</span><div><b>Exact dynamics → exact law</b><p>From the simulator's own derivative the extractor recovers the 5 true terms with every coefficient exact. ${F.known?.a ? "PASS" : ""}</p></div></div>
    <div class="step"><span class="no">b</span><div><b>Shuffled targets must fail</b><p>Pairing frames with the wrong derivatives gives R² 0.003. ${F.known?.b ? "PASS" : ""}</p></div></div>
    <div class="step"><span class="no">c</span><div><b>An untrained network must fail</b><p>Its outputs are fit by 9 wrong terms: R² alone would have been fooled, the term set is not. ${F.known?.c ? "PASS" : ""}</p></div></div>
    <div class="step"><span class="no">✓</span><div><b>The blind verdict</b><p>The true parameters stayed in a sealed file until the law had been read from the model: exactly the 5 true terms, R² ${f(F.law_r2, 3)}.</p></div></div></div>`}; },
  fluidRegimes: () => ({kicker: "Fluid", title: "The law in each regime", html: `<div class="kv">${Object.entries(S.fluid.regimes).map(([k, v]) => `<div class="mstat"><span class="l">${esc(k)}</span><span class="v">R² ${f(v.r2, 3)}</span></div>`).join("")}</div>
    <p class="note" style="margin-top:12px">In the forced equilibrium the law read from the model equals the truth within about 2%. In early transients drag disappears and forcing weakens: the model applies them only where it mostly saw them.</p>
    <div style="margin-top:12px" class="kv">${Object.entries(S.fluid.amplitude || {}).map(([k, v]) => `<div class="mstat"><span class="l">amplitude ×${k}</span><span class="v">advection ${f(-v.adv, 3)}</span></div>`).join("")}</div>`}),
  fluidPooled: () => { const F = S.fluid; return {kicker: "Fluid", title: "Pooled fit and out of distribution", html: `
    <p class="note">Fit over all regimes at once (the registered verdict): R² ${f(F.law_r2, 3)}.</p><div class="eq">${tex(lawTex(F.law, ["adv", "lap_omega", "omega", "sin(4y)", "v"]))}</div>
    <p class="note">The true law fits the model's dynamics even better (R² ${f(F.r2_true_law, 3)}), which is why the pooled drag and forcing gaps are not the model's physics: they come from mixing regimes.</p>
    <p class="note" style="margin-top:12px"><b>Out of distribution</b> (strong and fine-grained fields): the model is no longer applying the law. R² ${f(F.law_ood_r2, 2)}, terms: ${Object.keys(F.law_ood).join(", ")}.</p>`}; },
  fluidMech: () => { const F = S.fluid, bs = F.biot_savart; return {kicker: "Fluid", title: "Mechanism details", html: `<div class="kv">
    <div class="mstat"><span class="l">Velocity layer</span><span class="v">block ${F.velocity_site}</span></div>
    <div class="mstat"><span class="l">Blob response match</span><span class="v">${f(bs.trained.corr_all, 3)}</span></div>
    <div class="mstat"><span class="l">Far field, trained</span><span class="v">${f(bs.trained["corr_far_r>=9"], 3)}</span></div>
    <div class="mstat"><span class="l">Far field, untrained</span><span class="v">${f(bs.control["corr_far_r>=9"], 3)}</span></div>
    <div class="mstat"><span class="l">Velocity swap vs law</span><span class="v">${f(F.swap.model_vs_law_corr[0], 2)}</span></div>
    <div class="mstat"><span class="l">Swap control</span><span class="v">${f(F.swap.control_corr[0], 2)}</span></div></div>
    <p class="note" style="margin-top:12px"><b>Velocity swap.</b> Replacing the model's internal velocity (block 5) with another flow's makes it advect with that velocity: its output change matches the law's prediction with the swapped velocity (0.86), not with an unrelated flow's (0.28). At block 1, before velocity forms, the same swap barely moves the output (1.4% vs 66%).</p>`}; },
  smokeTests: () => { const D = S.smoke; return {kicker: "K2", title: "How the smoke model was tested", html: `<div class="steps">
    <div class="step"><span class="no">a</span><div><b>True velocity → exact law</b><p>From the simulator's dye derivative the extractor recovers advection and diffusion exactly. ${D.known?.a ? "PASS" : ""}</p></div></div>
    <div class="step"><span class="no">b</span><div><b>Shuffled velocity must fail</b><p>R² 0.016 and no advection term. ${D.known?.b ? "PASS" : ""}</p></div></div>
    <div class="step"><span class="no">1</span><div><b>Velocity inside the model</b><p>Best layer R² ${f(Math.max(...D.probe_trained), 3)}; the untrained copy stays near 0.</p></div></div>
    <div class="step"><span class="no">2</span><div><b>Law from the model's own velocity</b><p>Exactly {advection, diffusion} out of the library; R² ${f(D.law_model_velocity_r2, 3)}.</p></div></div></div>`}; },
  chessTests: () => { const k = S.chess.k3 || {}; return {kicker: "K3", title: "Chess known-answer tests", html: `<div class="steps">
    <div class="step"><span class="no">${k.K3a?.pass ? "✓" : "✗"}</span><div><b>Material readable at the last layer (≥ 0.9)</b><p>${f(k.K3a?.last_site?.r2_trained, 3)} at the last layer (FAIL as registered); peak ${f(k.K3a?.best?.r2_trained, 3)} at block ${k.K3a?.best_site}. By the end the network has turned material into evaluation.</p></div></div>
    <div class="step"><span class="no">${k.K3b?.pass ? "✓" : "✗"}</span><div><b>Classical surrogate explains ≥ half the evaluation</b><p>${pc(k.K3b?.r2_LD2)} on held-out positions; the second network ${pc(k.K3b?.r2_744706_reported)}; the two networks agree at ${f(k.K3b?.corr_LD2_744706_values, 3)}.</p></div></div>
    <div class="step"><span class="no">${k.K3c?.pass ? "✓" : "✗"}</span><div><b>Noise and shuffled concepts must not pass</b><p>Gains ${f(k.K3c?.noise?.gain, 4)} and ${f(k.K3c?.shuffled_material?.gain, 4)} (bar 0.005).</p></div></div></div>`}; },
  strongHow: () => { const T = S.chess.strong, k = T.check?.checks || {}, kc = T.king_cause || {}, lc = T.lost_cause || {}, tc = T.trade_cause || {}; return {kicker: "K10–K11", title: "How the strong network's rules were tested", html: `<div class="steps">
    <div class="step"><span class="no">1</span><div><b>The port answers known positions</b><p>Opening (${esc((k.start?.top4 || []).join(", "))}), mate in one for both colours, queen up ${f(k.queen_up?.white_up_q, 3)} / ${f(k.queen_up?.black_up_q, 3)}, value agreement with LD2 ${f(k.agreement_LD2?.value_corr, 2)}. A shuffled copy fails.</p></div></div>
    <div class="step"><span class="no">2</span><div><b>Mine against a control line</b><p>About 6,000 situation × move-type rules. A rule must beat the largest effect seen in 20 runs with network and human labels shuffled. The strongest are textbook principles, recovered unprompted: develop knights while castling is still possible, push centre pawns while many pieces are on, push flank pawns in endgames, push pawns against an uncastled king.</p></div></div>
    <div class="step"><span class="no">3</span><div><b>Three networks, every rating band, fresh games</b><p>t1, LD2 and 744706 must all show the tendency, in every rating band, and again on 16,000 positions from games never looked at. 7 frozen candidates went in; 4 confirmed, plus queen trades in lost positions.</p></div></div>
    <div class="step"><span class="no">4</span><div><b>Cause, by editing the board</b><p>Enemy king moved from the centre to a castled square: lever appetite −${Math.round(100 * kc.relative_drop_castled)}% vs −${Math.round(100 * kc.relative_drop_centre)}% for a matched move (real, but under the 30% bar). Material and lostness: no effect (${Math.round(100 * (tc.relative_drop_when_level || 0))}% vs ${Math.round(100 * (tc.relative_drop_when_two_down || 0))}%; ${Math.round(100 * (lc.rescued?.relative_drop || 0))}% vs ${Math.round(100 * (lc.control?.relative_drop || 0))}%).</p></div></div>
    <div class="step"><span class="no">5</span><div><b>Worth, by the network's own judgement</b><p>When lost, t1's queen trade lifts its draw chance from ${pc(T.mechanism?.draw_prob_after_human_move)} to ${pc(T.mechanism?.draw_prob_after_t1_trade)} compared with the human's move.</p></div></div>
    <div class="step"><span class="no">6</span><div><b>Transfer, by real game results</b><p>On 40,000 positions from new games: what playing the network's move of the rule's type adds for humans beyond playing its other moves there, adjusted for the position's value. The leans seen on the first 16,000 games (levers +16, trades 0) did not hold up: the network's moves help humans by about 8 points whatever they are, and no rule adds to that reliably.</p></div></div>
    <div class="step"><span class="no">7</span><div><b>Play it out</b><p>146 lost positions, each played twice by t1: after its queen trade, and after its best other move. Against t1 the lost side scores ${f(T.playout?.["strong opponent (t1 greedy) | judge LD2"]?.score_A_queen_trade, 3)} vs ${f(T.playout?.["strong opponent (t1 greedy) | judge LD2"]?.score_B_best_other, 3)} (+0.066, CI 0.017 to 0.119; 234 of 292 games ended by play). Against LD2 sampling its moves, +0.01. The strategy works against strong opposition.</p></div></div></div>`}; },
  strongEx: () => { const E = S.chess.strong.examples || {}, nm = {c3: "Enemy king in the centre → pawn lever", c0: "Quiet position → pawn lever", e1: "Lost → trade queens"};
    return {kicker: "Chess", title: "Teaching positions (fresh games, players rated 1700+)", wide: true, html: Object.keys(nm).filter(k => E[k]).map(k => `<h4 style="margin:4px 0 10px">${esc(nm[k])}</h4><div class="ex-grid" style="margin-bottom:18px">${E[k].slice(0, 3).map(e => `<div class="ex">${board(e.fen)}<div class="cap">${e.to_move} to move · network <b>${esc(e.t1)}</b> · human (${e.human_elo}) <b>${esc(e.human)}</b> · ${esc(e.result)}${e.game ? ` · <a href="${esc(e.game)}" target="_blank" rel="noopener">game</a>` : ""}</div></div>`).join("")}</div>`).join("")}; },
  chessCands: () => ({kicker: "Chess", title: `Every candidate (${S.chess.candidates.length})`, wide: true, html: `<div style="display:flex;flex-direction:column;gap:10px">${S.chess.candidates.map(c => candRow(c, false)).join("")}</div>`}),
  chessUnits: () => ({kicker: "Chess", title: "Rules read from the network's units", wide: true, html: `<div style="display:flex;flex-direction:column;gap:10px">${(S.chess.unit_rules || []).map(u => `<div class="cand"><div class="t"><span class="nm">${esc(u.unit)}</span>${u.test ? `<span class="badge ${u.test.accepted ? "ok" : "no"}">${u.test.accepted ? "accepted" : "not accepted"}</span>` : ""}</div><div class="rule">${esc(u.rule)}</div><div class="note">tree fidelity R² ${f(u.tree_fidelity_r2, 3)} · fires on ${pc(u.frequency)} of positions${u.test ? ` · gain ${f(u.test.gain_LD2.gain, 4)} [${f(u.test.gain_LD2.ci95[0], 4)}, ${f(u.test.gain_LD2.ci95[1], 4)}] · second network ${f(u.test.gain_744706.gain, 4)} · decodable ${f(u.test.decodability.trained, 2)} vs ${f(u.test.decodability.control, 2)} · max |corr| with library ${f(Math.abs(u.test.max_corr_library[1]), 2)}` : ""}${u.gain_quiet_over_library_plus_calc ? ` · gain in quiet positions ${f(u.gain_quiet_over_library_plus_calc.gain, 4)}` : ""}</div></div>`).join("")}</div>`}),
};
function clusterSheet(i) {
  const c = S.chess.clusters[i];
  openSheet({kicker: `Cluster ${c.cluster} · ${c.n} positions`, title: c.mean_residual > 0 ? "Leela is more optimistic than classical chess" : "Leela is more pessimistic than classical chess", wide: true,
    html: `<p class="note">Mean network value ${f(c.mean_q, 2)} vs classical estimate ${f(c.mean_qhat, 2)} for the side to move; ${pc(c.consistency)} of the cluster goes this way.</p>
      <div class="cl-grid" style="margin-top:12px">${c.prototypes.map(p => `<div class="cl" style="cursor:default">${board(p.fen)}<div class="meta"><span>Leela plays <b style="color:var(--text-1)">${esc(p.move)}</b></span><span>value ${f(p.q, 2)}</span></div></div>`).join("")}</div>
      <div class="card-s" style="margin:14px 0 6px">Unusual classical concepts (z-scores)</div><div class="crit">${c.concept_z.map(([n, z]) => `<span class="badge ${z > 0 ? "ok" : "no"}">${esc(n)} ${z > 0 ? "+" : ""}${z}</span>`).join("")}</div>
      ${c.themes.length ? `<div class="card-s" style="margin:14px 0 6px">Lichess puzzle themes</div><div class="crit">${c.themes.map(([t, n]) => `<span class="badge">${esc(t)} ${n}</span>`).join("")}</div>` : ""}`});
}

/* ================= wiring ================= */
function render() {
  document.querySelectorAll("#tg button").forEach(b => b.classList.toggle("on", b.dataset.t === T));
  $("#view").innerHTML = T === "fluid" ? fluid() : T === "smoke" ? smoke() : chessView();
  hydrateIcons($("#view")); fitMore($("#view"));
  history.replaceState(null, "", "?t=" + T);
}
document.addEventListener("click", e => {
  const s = e.target.closest("[data-sheet]"); if (s) { const o = SHEETS[s.dataset.sheet](); openSheet(o); return; }
  const c = e.target.closest("[data-cl]"); if (c) clusterSheet(+c.dataset.cl);
});
$("#tg").onclick = e => { const b = e.target.closest("button"); if (b) { T = b.dataset.t; render(); } };
$("#howBtn").onclick = () => openSheet(SHEETS.how());
hydrateIcons(document);
fetch("/api/kepler").then(r => r.json()).then(d => { S = d; const go = () => render(); if (window.katex) go(); else window.addEventListener("load", go); })
  .catch(() => { $("#view").innerHTML = `<div class="empty s12">Could not load Kepler's results.</div>`; });
</script>
</body>
</html>
